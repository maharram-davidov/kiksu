      description: |
        Screen 07. Aggregates come from `public.instructor_review_summary`, which is
        trigger-maintained — the review list never aggregates at read time.

        **Aggregates are never walled.** They are readable by every authenticated caller, so
        walling them here would be a lie the client could route around. Only the list of
        *written* reviews is subject to the contribution wall.
      parameters:
