                      - { id: "0193f350-a0b1-7c2d-e3f4-5a6b7c8d9e0f", code: "CS 214", title: "Verilənlər bazası sistemləri", review_count: 41, rating_avg: 4.3 }
                      - { id: "0193f351-b1c2-7d3e-f4a5-6b7c8d9e0f1a", code: "CS 101", title: "Proqramlaşdırmaya giriş", review_count: 15, rating_avg: 4.0 }
