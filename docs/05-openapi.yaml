openapi: 3.1.0

info:
  title: Kiksu API — Phase 1 spine
  version: "1.0.0"
  summary: Onboarding, verification, session, timetable, forum and reviews for Kiksu.
  description: |
    Server-layer HTTP contract for Kiksu, the anonymous app for university students in
    Azerbaijan.

    **Read `docs/05-api-conventions.md` first.** It is binding on every operation here:
    versioning and app-store rollout (§1), the JWT claim allowlist and the `user_metadata`
    trap (§2), the closed error code set and the deliberately uniform codes (§3), keyset
    cursors (§4), rate limits (§5), idempotency (§6), and — most importantly — §8, the
    field-by-field prohibition on any response that links two identity layers.

    **Scope.** Phase 1 only: onboarding and verification (all three routes), session,
    profile and privacy, timetable (catalogue, sections, week grid, attendance, deadlines,
    GPA), forum (boards, feeds, posts, comments, votes, polls, alias preview), and reviews
    (professor and course profiles, review list, write review, contribution wall).
    Marketplace, vacancies, careers, events and clubs are Phase 2/3 and are deliberately
    absent. There are **zero** career-layer fields anywhere in this document, by
    `02-identity-spec.md` assertion 3.

    **Servability.** Every response field traces to a column, a view or a documented server
    computation in `docs/01-schema.sql`. Fields that are computed rather than stored say so
    in their description.

    **The three rules that shape most of these schemas.**
    1. Forum content carries an *alias*, never an author. `public.post` and
       `public.post_comment` have no author column by design; authorship lives in
       `internal.*`, which no read path touches.
    2. A read of another user returns `PublicProfile` — the six columns of
       `public.public_profiles` — and nothing else. No karma, no `created_at`, no counts,
       no card-review state.
    3. Anonymous content carries a coarse time bucket, never a timestamp.
  contact:
    name: Kiksu API
    url: https://docs.kiksu.az/api
  license:
    name: Proprietary
    identifier: LicenseRef-Kiksu-Proprietary

servers:
  - url: https://api.kiksu.az/v1
    description: Production (eu-central-1, Frankfurt)
  - url: https://staging.api.kiksu.az/v1
    description: Staging

security:
  - supabaseJwt: []

tags:
  - name: meta
    description: Cold-start configuration. Unauthenticated.
  - name: onboarding
    description: University list and the three verification routes.
  - name: session
    description: Own account, privacy settings, handle.
  - name: profiles
    description: Reading another user. One shape only.
  - name: catalogue
    description: Courses, sections and instructors from `ref`.
  - name: timetable
    description: Enrollment, the week grid, attendance, deadlines, GPA.
  - name: forum
    description: Boards, feeds, posts, comments, votes, polls, alias preview.
  - name: reviews
    description: Professor and course profiles, the review list, the contribution wall.
  - name: safety
    description: Reports and blocks.

paths:

  # ==================================================================
  # META
  # ==================================================================

  /bootstrap:
    get:
      tags: [meta]
      operationId: getBootstrap
      summary: Cold-start configuration
      description: |
        Called on every cold start, before rendering anything that depends on server
        behaviour. Unauthenticated, cacheable for 300 s.

        This endpoint is how a store-distributed app that cannot be force-upgraded still
        gets told it is too old (`min_supported_client`), and how server-owned copy reaches
        it — including the verification SLA labels, which must be able to stop claiming
        `2 dəqiqə` within two hours of the measured p95 breaching it
        (`02-identity-spec.md` §2.1 honesty rule).

        If this call fails the client proceeds with bundled defaults. A bootstrap outage
        must never brick the app.
      security: []
      responses:
        "200":
          description: Configuration.
          headers:
            Cache-Control:
              schema: { type: string, examples: ["public, max-age=300"] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bootstrap" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ==================================================================
  # ONBOARDING AND VERIFICATION
  # ==================================================================

  /universities:
    get:
      tags: [onboarding]
      operationId: listUniversities
      summary: Universities offered in the picker
      description: |
        Screen 01. Unauthenticated — this runs before any account exists.

        A university appears here only when it is active *and* its email-delivery probe is
        green (`02-identity-spec.md` §2.1: a university cannot be enabled in the picker
        until its probe is green). Ordering is `onboarding_order`.
      security: []
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Universities.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/University" }
              examples:
                launch:
                  summary: The four launch universities
                  value:
                    items:
                      - id: "0193f2c1-9f4e-7a11-bd3c-6a2f0f1e77aa"
                        code: "BDU"
                        name: "Bakı Dövlət Universiteti"
                        city: "Bakı"
                        brand_color: "#0F7A85"
                        logo_url: "https://cdn.kiksu.az/u/9f2c1a4b8e0d.png"
                        email_sample_pattern: "ad.soyad@std.bsu.edu.az"
                      - id: "0193f2c1-a0b2-7c44-8e21-4f7a1d2b3c55"
                        code: "ADA"
                        name: "ADA Universiteti"
                        city: "Bakı"
                        brand_color: "#1B3A6B"
                        logo_url: "https://cdn.kiksu.az/u/3b7e9c0f1a2d.png"
                        email_sample_pattern: "ad.soyad@ada.edu.az"
                      - id: "0193f2c1-b1c3-7d55-9f32-5a8b2e3c4d66"
                        code: "UNEC"
                        name: "Azərbaycan Dövlət İqtisad Universiteti"
                        city: "Bakı"
                        brand_color: "#0F7A85"
                        logo_url: "https://cdn.kiksu.az/u/7c1d2e3f4a5b.png"
                        email_sample_pattern: "ad.soyad@unec.edu.az"
                      - id: "0193f2c1-c2d4-7e66-a043-6b9c3f4d5e77"
                        code: "BMU"
                        name: "Bakı Mühəndislik Universiteti"
                        city: "Xırdalan"
                        brand_color: "#B23A2F"
                        logo_url: "https://cdn.kiksu.az/u/5e6f7a8b9c0d.png"
                        email_sample_pattern: "ad.soyad@std.bmu.edu.az"
        "500": { $ref: "#/components/responses/InternalError" }

  /universities/{university_id}/verification-routes:
    get:
      tags: [onboarding]
      operationId: listVerificationRoutes
      summary: Verification routes offered by a university, with server-authored SLA copy
      description: |
        Screen 01→02. `sla_label` is **server-authored and flag-gated**, not a bundled
        string: when the measured p95 for this university's mail domain exceeds 120 s for
        two consecutive hours, this endpoint stops returning `2 dəqiqə` and returns the
        measured value instead. Same mechanism for the card route's `24 saata qədər`.
        See `05-api-conventions.md` §1.6.
      security: []
      parameters:
        - $ref: "#/components/parameters/UniversityIdPath"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Routes, in display order.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/VerificationRoute" }
              examples:
                bdu:
                  summary: BDU — all three routes
                  value:
                    items:
                      - method: "university_email"
                        is_recommended: true
                        sla_label: "2 dəqiqə"
                        note: "Universitet e-poçtuna 6 rəqəmli kod göndəririk."
                        sample_pattern: "ad.soyad@std.bsu.edu.az"
                        display_order: 1
                      - method: "student_card"
                        is_recommended: false
                        sla_label: "24 saata qədər"
                        note: "Tələbə kartının şəklini yüklə. Əl ilə yoxlanılır."
                        sample_pattern: null
                        display_order: 2
                      - method: "invite_code"
                        is_recommended: false
                        sla_label: "Dərhal"
                        note: "Kursdaşından 6 rəqəmli kod."
                        sample_pattern: null
                        display_order: 3
        "404": { $ref: "#/components/responses/NotFound" }

  /verification/email/start:
    post:
      tags: [onboarding]
      operationId: startEmailVerification
      summary: Route A — send the OTP
      description: |
        State `A2 address_submitted` → `A3 otp_sent`.

        **The response is identical for a fresh address, an already-registered address and
        a banned address** — same status, same body, same timing
        (`02-identity-spec.md` §2.1 anti-enumeration ordering, assertion 59). "Already
        registered" and "banned" are only ever revealed *after* the OTP succeeds, at which
        point the caller has proved control of the mailbox and learns nothing they could not
        learn from it.

        Rate limits: 60 s resend cooldown, 3/address/hour, 10/address/day, 5 distinct
        addresses/device/day. Exceeding any of them returns `429 rate_limited`, which is
        itself uniform across the four.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [university_id, email]
              properties:
                university_id:
                  type: string
                  format: uuid
                  description: Must be the university the student selected. The domain is checked against this university's allowlist.
                email:
                  type: string
                  format: email
                  description: |
                    Normalised server-side with a **locale-invariant** lowercase before
                    hashing. `02-identity-spec.md` §6.2: an `az-AZ` device lowercasing `I`
                    yields `ı`, which would produce a different credential hash and let the
                    same student hold two accounts.
                  examples: ["ayselr@std.bsu.edu.az"]
            examples:
              bdu:
                value:
                  university_id: "0193f2c1-9f4e-7a11-bd3c-6a2f0f1e77aa"
                  email: "ayselr@std.bsu.edu.az"
      responses:
        "202":
          description: |
            Accepted. Byte-identical for fresh, registered and banned addresses.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OtpChallengeAccepted" }
              examples:
                sent:
                  value:
                    attempt_id: "0193f2d0-1a2b-7c3d-8e4f-5a6b7c8d9e0f"
                    expires_at: "2026-08-15T09:22:41Z"
                    resend_available_at: "2026-08-15T09:13:41Z"
                    message: "Kod göndərildi. Poçtunu yoxla."
        "422":
          description: |
            `verification_domain_not_allowed` — the address domain is not on this
            university's allowlist (state `A_domain_reject`). Safe to disclose: it is a
            property of the university, not of any account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                wrongDomain:
                  value:
                    error:
                      code: "verification_domain_not_allowed"
                      message: "Bu ünvan BDU-nun tələbə domenində deyil. Nümunə: ad.soyad@std.bsu.edu.az"
                      message_key: "err.verification_domain_not_allowed"
                      action: "none"
                      action_label: null
                      details: {}
                      request_id: "01JAV2H0S8QK5T7ZC9WX3M4B6D"
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /verification/email/verify:
    post:
      tags: [onboarding]
      operationId: verifyEmailOtp
      summary: Route A — submit the OTP
      description: |
        State `A3` → `A4 otp_verified` → `A5 granted`. On success the grant transaction runs
        in one transaction with no external calls: seal the identity record, bind the
        credential hash under a uniqueness guarantee, recompute tier, increment
        `identity_epoch`, mint a fresh session.

        The client **must refresh its access token** after a `200` here: the tier claim in
        the current token is stale and the epoch has moved, so the next call would return
        `401 token_stale` anyway.

        Failure modes are deliberately merged:
        `verification_challenge_invalid` covers wrong *and* expired codes;
        `credential_unavailable` covers "already bound to a live account" *and* "in the ban
        set" with a byte-identical body (assertions 31, 49).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attempt_id, code]
              properties:
                attempt_id: { type: string, format: uuid }
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
                  examples: ["481902"]
      responses:
        "200":
          description: Verified and granted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationGranted" }
              examples:
                granted:
                  value:
                    tier: "email"
                    verification_status: "email"
                    handle: "sakit-pərvanə-37"
                    token_refresh_required: true
                    message: "E-poçt doğrulandı."
        "400":
          description: "`verification_challenge_invalid` — wrong or expired code."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                wrong:
                  value:
                    error:
                      code: "verification_challenge_invalid"
                      message: "Kod düzgün deyil. 3 cəhdin qalıb."
                      message_key: "err.verification_challenge_invalid"
                      action: "retry"
                      action_label: "Yenidən cəhd et"
                      details: { attempts_remaining: 3 }
                      request_id: "01JAV2H1T9RM6U8ZD0XY4N5C7E"
        "409":
          description: |
            `credential_unavailable`. **Uniform** across "already bound" and "banned".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                unavailable:
                  value:
                    error:
                      code: "credential_unavailable"
                      message: "Bu ünvanla davam edə bilmirik. Dəstəklə əlaqə saxla."
                      message_key: "err.credential_unavailable"
                      action: "contact_support"
                      action_label: "Dəstəyə yaz"
                      details: {}
                      request_id: "01JAV2H2U0SN7V9ZE1YZ5P6D8F"
        "429": { $ref: "#/components/responses/RateLimited" }

  /verification/card/upload-target:
    post:
      tags: [onboarding]
      operationId: createCardUploadTarget
      summary: Route B — one-shot signed upload target for the card photo
      description: |
        The image goes **straight to a private quarantine bucket**, never through this API
        and never into any bucket a client can read. The returned key is ≥128 bits of
        randomness in a flat namespace with no user, thread or prefix component
        (`02-identity-spec.md` T7, assertion 28).

        The raw image is deleted within 24 h of the verification decision (30-day cap for
        appeals). What is retained is the decision, reason codes, reviewer id, a perceptual
        hash and the keyed student-ID hash — never the photograph (assertion 63).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_type, byte_size]
              properties:
                content_type: { type: string, enum: ["image/jpeg", "image/png", "image/heic"] }
                byte_size: { type: integer, minimum: 1, maximum: 12000000 }
      responses:
        "201":
          description: Upload target.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadTarget" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /verification/card/submissions:
    post:
      tags: [onboarding]
      operationId: submitCardVerification
      summary: Route B — submit the uploaded card for manual review
      description: |
        States `B2 uploaded` → `B3 auto_screen` → `B4 queued`. The SLA clock starts at `B4`.

        Max 3 submissions per 30 days, then appeal only (`card_submission_limit_reached`).

        Auto-screen rejections that indicate suspected forgery return the **generic**
        `"doğrulaya bilmədik"` message with no specific reason — specific feedback teaches
        forgers what to fix (`02-identity-spec.md` §2.2).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [upload_id, university_id]
              properties:
                upload_id: { type: string, format: uuid }
                university_id: { type: string, format: uuid }
      responses:
        "202":
          description: Queued for review.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardSubmissionAccepted" }
              examples:
                queued:
                  value:
                    attempt_id: "0193f2e1-2b3c-7d4e-9f50-6a7b8c9d0e1f"
                    state: "pending"
                    sla_due_at: "2026-08-16T09:20:00Z"
                    sla_label: "24 saata qədər"
                    message: "Kart yoxlamaya göndərildi."
        "409":
          description: "`card_review_pending` — a submission is already queued or in review."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /verification/invite/redeem:
    post:
      tags: [onboarding]
      operationId: redeemInviteCode
      summary: Route C — redeem a 6-digit invite code
      description: |
        States `C1` → `C2 code_valid` → `C3 provisional`.

        **Every failure returns the single code `invite_code_invalid`** — wrong, expired,
        already consumed, and wrong-university are indistinguishable in body and in timing
        (`02-identity-spec.md` T13, assertion 60). Anything finer turns the 10⁶ code space
        into an oracle.

        The provisional tier is a **7-day funnel, not a destination**: no badge, 3 posts a
        day, no reviews, no invites, and it reverts to read-only unless a real verification
        completes.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [university_id, code]
              properties:
                university_id:
                  type: string
                  format: uuid
                  description: Codes are scoped to the inviter's university; a mismatch fails as `invite_code_invalid`.
                code: { type: string, pattern: "^[0-9]{6}$", examples: ["704318"] }
      responses:
        "200":
          description: Provisional grant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationGranted" }
              examples:
                provisional:
                  value:
                    tier: "provisional"
                    verification_status: "none"
                    handle: "quru-püstə-19"
                    token_refresh_required: true
                    provisional_expires_at: "2026-08-22T09:20:00Z"
                    message: "Müvəqqəti giriş açıldı. 7 gün ərzində e-poçtunu doğrula."
        "400":
          description: "`invite_code_invalid`. Uniform across all four causes."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                invalid:
                  value:
                    error:
                      code: "invite_code_invalid"
                      message: "Kod işləmir. Kursdaşından yeni kod istə."
                      message_key: "err.invite_code_invalid"
                      action: "none"
                      action_label: null
                      details: {}
                      request_id: "01JAV2H3V1TP8W0AF2Z06Q7E9G"
        "429": { $ref: "#/components/responses/RateLimited" }

  /verification/status:
    get:
      tags: [onboarding]
      operationId: getVerificationStatus
      summary: Own verification state across all routes
      description: |
        Screen 10 renders `✓ E-POÇT DOĞRULANDI` and `KART: GÖZLƏYİR` at the same time, so
        this returns **one entry per route**, not a single state. Own-account only; there is
        no form of this call for another user, and `card_review_state` is never in
        `PublicProfile` because a pending card review is a real-world event with a knowable
        timestamp.
      responses:
        "200":
          description: Per-route state plus the resulting tier.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationStatus" }
              examples:
                emailDoneCardPending:
                  value:
                    tier: "email"
                    verification_status: "email"
                    routes:
                      - method: "university_email"
                        state: "verified"
                        label: "E-poçt doğrulandı"
                        valid_until: "2027-08-15T00:00:00Z"
                        reverification_due: false
                      - method: "student_card"
                        state: "in_review"
                        label: "Kart: gözləyir"
                        sla_due_at: "2026-08-16T09:20:00Z"
                      - method: "invite_code"
                        state: "none"
                        label: "İstifadə olunmayıb"
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /invites:
    get:
      tags: [onboarding]
      operationId: listOwnInvites
      summary: Own live invite codes
      description: |
        The caller's own codes only, so the client can enforce the 3-live-code cap.

        **Returns nothing about redeemers.** The invite edge (inviter → invitee) lives in
        the sealed layer, is access-logged, is never used for recommendations or
        notifications, and is aggregated away after 30 days
        (`02-identity-spec.md` T12, assertion 64).

        Whether even the per-code `state` should be visible is an open question — see
        `05-api-conventions.md` Open question 9.
      responses:
        "200":
          description: Live codes.
          content:
            application/json:
              schema:
                type: object
                required: [items, remaining_issuable]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/InviteCode" }
                  remaining_issuable: { type: integer, minimum: 0, maximum: 3 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [onboarding]
      operationId: issueInviteCode
      summary: Issue an invite code
      description: |
        Requires tier `email` or `card`, account age ≥ 14 days and karma ≥ 20 (all tunable,
        all flagged in the identity spec). Max 3 live codes, 72-hour TTL, single use, drawn
        uniformly at random from the unallocated space **within the issuer's university
        namespace**.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Code issued. This is the only time the plaintext code is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteCodeIssued" }
              examples:
                issued:
                  value:
                    id: "0193f2f2-3c4d-7e5f-a061-7b8c9d0e1f2a"
                    code: "704318"
                    expires_at: "2026-08-18T09:20:00Z"
                    university_code: "BDU"
        "403":
          description: "`invite_not_permitted` or `verification_required`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`invite_quota_exhausted` — three live codes already."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ==================================================================
  # SESSION AND PROFILE
  # ==================================================================

  /session:
    get:
      tags: [session]
      operationId: getSession
      summary: The signed-in student's own account
      description: |
        Served from `public.app_user_card`, which is `security_invoker = on` and therefore
        RLS-confined to the caller's own row. Exact `karma` and `created_at` appear here and
        **only** here: they are the caller's own. They appear in no cross-user surface, which
        is what closes the karma-delta oracle (`02-identity-spec.md` T5).

        `display_study_year` and `display_faculty_label` have already passed the k-anonymity
        floor before they reach this response; when the cohort was too small they are simply
        absent, with no indication that suppression occurred and no count.
      responses:
        "200":
          description: Own account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionUser" }
              examples:
                bduStudent:
                  value:
                    id: "0193f301-4d5e-7f60-b172-8c9d0e1f2a3b"
                    handle: "sakit-pərvanə-37"
                    handle_number: 37
                    avatar_id: 7
                    verification_tier: "email_verified"
                    verification_status: "email"
                    contributor_level: 2
                    university:
                      id: "0193f2c1-9f4e-7a11-bd3c-6a2f0f1e77aa"
                      code: "BDU"
                      name: "Bakı Dövlət Universiteti"
                    display_study_year: 2
                    display_faculty_label: null
                    karma: 312
                    post_count: 28
                    comment_count: 141
                    review_count: 3
                    locale: "az"
                    feed_languages: ["az", "ru"]
                    status: "active"
                    created_at: "2025-09-02T11:04:00Z"
                    handle_change_allowed_at: "2026-08-24T11:04:00Z"
                    privacy:
                      show_year: true
                      share_timetable: false
                      show_uni_badge: true
                      link_listings: false
                      discoverable: false
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /me/privacy:
    patch:
      tags: [session]
      operationId: updatePrivacySettings
      summary: Update the five privacy toggles
      description: |
        Screen 10. Every field is optional; omitted fields are unchanged.

        `show_year` interacts with the k-anonymity floor rather than overriding it: turning
        it on does not reveal the year if the cohort is below the floor, and the response
        reflects the *effective* state, not the requested one. The cohort count behind that
        decision is never returned (assertion 35).

        `discoverable` controls exact-handle lookup only. Prefix, substring and fuzzy search
        do not exist at any setting (`02-identity-spec.md` T11, assertion 41).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrivacySettings" }
            examples:
              hideYear:
                value: { show_year: false }
      responses:
        "200":
          description: Effective settings after the update.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacySettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /me/preferences:
    patch:
      tags: [session]
      operationId: updatePreferences
      summary: Locale and feed languages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                locale: { $ref: "#/components/schemas/LocaleCode" }
                feed_languages:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/LocaleCode" }
            examples:
              azRu:
                value: { locale: "az", feed_languages: ["az", "ru"] }
      responses:
        "200":
          description: Updated preferences.
          content:
            application/json:
              schema:
                type: object
                properties:
                  locale: { $ref: "#/components/schemas/LocaleCode" }
                  feed_languages:
                    type: array
                    items: { $ref: "#/components/schemas/LocaleCode" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /me/handle:
    post:
      tags: [session]
      operationId: regenerateHandle
      summary: Draw a new generated handle
      description: |
        Handles are **generated, never chosen** — `adjective-noun-NN` from the curated
        Azerbaijani wordlist in `ref.handle_word`, drawn from a CSPRNG. There is no request
        body: the client cannot propose a handle, which is what removes the
        adversarial-crafting problem entirely (`02-identity-spec.md` §4.3).

        The 14-day cooldown is enforced **server-side** on `handle_changed_at`, not by
        disabling the button (assertion 47). A direct call inside the window is refused with
        `handle_cooldown_active`.

        `avatar_id` is derived from the folded handle and therefore **changes with it**. An
        avatar that survived a rename would link the old handle to the new one and defeat
        the point of renaming.

        The rename is never announced: no notification, no "formerly known as", no rename
        history on any surface, ever (T20).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: New handle.
          content:
            application/json:
              schema:
                type: object
                required: [handle, handle_number, avatar_id, handle_change_allowed_at]
                properties:
                  handle: { type: string, examples: ["quru-püstə-19"] }
                  handle_number: { type: integer, examples: [19] }
                  avatar_id: { type: integer, minimum: 0, maximum: 11, examples: [3] }
                  handle_change_allowed_at: { type: string, format: date-time }
        "409":
          description: "`handle_cooldown_active`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                cooldown:
                  value:
                    error:
                      code: "handle_cooldown_active"
                      message: "Ləqəb 14 gündən bir dəyişilir. 24 avqustdan sonra yenidən dəyişə bilərsən."
                      message_key: "err.handle_cooldown_active"
                      action: "wait_cooldown"
                      action_label: null
                      details: { available_at: "2026-08-24T11:04:00Z" }
                      request_id: "01JAV2H4W2UQ9X1BG3A17R8F0H"
        "503":
          description: "`handle_space_exhausted` — generator failure, pages on-call."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /me/posts:
    get:
      tags: [session]
      operationId: listOwnPosts
      summary: The caller's own posts
      description: |
        "My posts" cannot be a filter on the feed, because `public.post` has no author
        column. It is served here by reading `internal.post_author` **server-side, scoped to
        the token**. There is no `?author=` parameter anywhere in this API
        (`05-api-conventions.md` §8.2 P12).

        Because the subject is the caller, this response may carry each post's own alias
        ordinal — the caller already knows it.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Own posts, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /profiles/{app_user_id}:
    get:
      tags: [profiles]
      operationId: getPublicProfile
      summary: Read another user
      description: |
        **The only cross-user read of another person in the product.** It returns
        `public.public_profiles` whole: six columns, no more. There is no expanded variant,
        no `?include=`, and no second endpoint that returns more.

        Not returned, at any tier, for anyone but yourself: karma, post/comment/review
        counts, `created_at` (account age correlates with cohort), `last_active_at`,
        `card_review_state`, complaint count, privacy toggles, or the fine-grained
        `verification_tier`. Adding a field here is a security change and is reviewed as one.
      parameters:
        - name: app_user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Public profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicProfile" }
              examples:
                seller:
                  value:
                    id: "0193f310-5e6f-7a71-c283-9d0e1f2a3b4c"
                    handle: "quru-püstə-19"
                    avatar_id: 3
                    university_id: "0193f2c1-9f4e-7a11-bd3c-6a2f0f1e77aa"
                    verification_status: "card"
                    contributor_level: 1
        "404": { $ref: "#/components/responses/NotFound" }

  /profiles/by-handle/{handle}:
    get:
      tags: [profiles]
      operationId: getProfileByHandle
      summary: Exact-handle lookup
      description: |
        **Exact full-handle matches only.** No prefix, no substring, no fuzzy, no wildcard —
        those would let an attacker walk the adjective × noun space and enumerate the entire
        user base together with each user's rendered university badge
        (`02-identity-spec.md` T11).

        The lookup only resolves when the target has `discoverable` on, which is **off by
        default**. The response for "no such handle", "exists but not discoverable" and
        "quarantined former handle" is a byte-identical `404` with an equalised response
        time (assertion 41). A quarantined handle never resolves to anything, including "this
        handle has changed".

        Rate limited to 10/hour and **the limit does not scale with tier or account age** —
        a card-verified third-year is exactly the attacker the threat model assumes.
      parameters:
        - name: handle
          in: path
          required: true
          schema: { type: string, examples: ["sakit-pərvanə-37"] }
      responses:
        "200":
          description: Public profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicProfile" }
        "404":
          description: Uniform not-found. Covers all three causes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /blocks:
    get:
      tags: [safety]
      operationId: listBlocks
      summary: The caller's block list
      description: |
        Renders the blocked user's handle **as it was at block time** — a stored display
        snapshot, never resolved live. A live resolution would turn the block list into a
        rename oracle: block many people, watch your own list, and learn the entire rename
        mapping (`02-identity-spec.md` §4.6, assertion 46).

        Enforcement uses the immutable id; unblocking is by `block_id`, never by handle.
      responses:
        "200":
          description: Blocks.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/BlockEntry" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [safety]
      operationId: createBlock
      summary: Block a user
      description: |
        Blocks are stored against the immutable `app_user_id` but their **visible effects are
        surface-scoped**. A block placed from a forum thread (`scope: "forum"`) suppresses
        forum content only. A **global** block may only be initiated from a handle-bearing
        surface, where the caller already knows the handle and therefore learns nothing new.

        This closes the cross-surface oracle of `02-identity-spec.md` T8: block `ANONİM 3`,
        watch whether a suspected marketplace listing disappears, confirm the hypothesis in
        one action.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                scope:
                  type: string
                  enum: [forum, global]
                  description: "`global` is rejected unless `app_user_id` is supplied, i.e. unless the block originates from a handle-bearing surface."
                app_user_id:
                  type: string
                  format: uuid
                  description: Required for `global`. Never accepted together with `comment_id`/`post_id`.
                post_id: { type: string, format: uuid, description: "Forum-scoped block on the author of this post." }
                comment_id: { type: string, format: uuid, description: "Forum-scoped block on the author of this comment." }
      responses:
        "201":
          description: Block created. Uniform whether or not a block already existed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockEntry" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /blocks/{block_id}:
    delete:
      tags: [safety]
      operationId: deleteBlock
      summary: Unblock, by list-entry id
      parameters:
        - name: block_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Unblocked. }
        "404": { $ref: "#/components/responses/NotFound" }

  /reports:
    post:
      tags: [safety]
      operationId: createReport
      summary: Report content
      description: |
        **Always succeeds with `202`**, whether or not the caller has already reported this
        target. The schema's `report_once_per_target` unique constraint is absorbed
        server-side and must never surface as `409`: "you have already reported this user"
        is a confirmation oracle (`02-identity-spec.md` T8, assertion 25).

        The response body is byte-identical for a first report and a duplicate.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_type, target_id, reason_key]
              properties:
                target_type:
                  type: string
                  enum: [post, comment, review, app_user]
                  description: Phase 1 subset of `public.report_target_type`.
                target_id: { type: string, format: uuid }
                reason_key:
                  type: string
                  description: A key from `ref.report_reason`.
                  examples: ["harassment"]
                details: { type: string, maxLength: 1000 }
            examples:
              harassment:
                value:
                  target_type: "comment"
                  target_id: "0193f330-7a8b-7c9d-e4a5-1f2a3b4c5d6e"
                  reason_key: "harassment"
                  details: "Şəxsi təhqir."
      responses:
        "202":
          description: Recorded. Identical for a duplicate report.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string, examples: ["Qeydə alındı."] }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ==================================================================
  # CATALOGUE
  # ==================================================================

  /terms:
    get:
      tags: [catalogue]
      operationId: listTerms
      summary: Academic terms for the caller's university
      description: Design renders `2025/26 · PAYIZ SEMESTRİ`. Exactly one term is `is_current`.
      responses:
        "200":
          description: Terms, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Term" }
              examples:
                bdu:
                  value:
                    items:
                      - id: "0193f340-8b9c-7d0e-f5b6-2a3b4c5d6e7f"
                        label: "2025/26 Payız"
                        season: "payiz"
                        starts_on: "2025-09-15"
                        ends_on: "2026-01-24"
                        add_drop_ends_on: "2025-09-29"
                        exams_start_on: "2026-01-05"
                        is_current: true
                      - id: "0193f341-9c0d-7e1f-a6c7-3b4c5d6e7f80"
                        label: "2024/25 Yaz"
