  /posts:
    post:
      tags: [forum]
      operationId: createPost
      summary: Create a thread
      description: |
        **The author always receives alias ordinal 1** — the counter starts at 0 and
        allocation runs for the author first, inside the same transaction as the content
        insert (`02-identity-spec.md` §3.4, assertion 15). The client does not send an
        ordinal and cannot influence it.

        `attachment_upload_ids` reference objects already uploaded through a signed target
        and already **re-encoded server-side with all metadata destroyed** — a re-encode,
        not a tag strip, because thumbnails embedded in EXIF survive naive stripping
        (T7, assertion 29). A post cannot reference an attachment that has not finished
        processing.

        Rate limited by `forum.post.create`, which scales by tier *and* account age: a
        provisional account gets 3/day, and an account under 24 hours old gets a quarter of
        its tier's allowance.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [board_id, title]
              properties:
                board_id: { type: string, format: uuid }
                kind: { $ref: "#/components/schemas/PostKind" }
                title: { type: string, minLength: 1, maxLength: 200 }
                body: { type: string, maxLength: 20000 }
                lang: { $ref: "#/components/schemas/LocaleCode" }
                attachment_upload_ids:
                  type: array
                  maxItems: 4
                  items: { type: string, format: uuid }
                poll: { $ref: "#/components/schemas/PollInput" }
            examples:
              text:
                value:
                  board_id: "0193f3b0-c8d9-7e05-a2b3-4c5d6e7f8091"
                  kind: "text"
                  title: "Aralıq imtahanı təxirə salındı, kim eşitdi?"
                  body: "Dekanlıqdan elan gəldi deyirlər, amma qrupda heç kim dəqiq bilmir."
                  lang: "az"
              poll:
                value:
                  board_id: "0193f3b0-c8d9-7e05-a2b3-4c5d6e7f8091"
                  kind: "poll"
                  title: "CS 214 üçün hansı gün konsultasiya olsun?"
                  lang: "az"
                  poll:
                    question: "Hansı gün?"
                    is_multi_choice: false
                    max_choices: 1
