  /boards/{board_id}/posts:
    get:
      tags: [forum]
      operationId: listBoardPosts
      summary: Board feed
      description: |
        The four tabs of screen 05. Each maps to a dedicated partial index, so the feed is
        an index scan with no aggregation at read time:

        | `tab` | Order | Design label |
        |---|---|---|
        | `hot` | `hot_rank desc` | `POPULYAR` |
        | `new` | `created_at desc` | `YENİ` |
        | `poll` | `created_at desc`, polls only | `SORĞU` |
        | `unanswered` | `created_at desc`, `comment_count = 0` | `CAVABSIZ` |

        Served from a cache with **TTL ≥ 60 s** and a **60-second-quantised cursor**
        (`02-identity-spec.md` T9(ii)): continuous polling cannot recover sub-minute
        ordering, which is what makes the timing-correlation attack against a class end time
        much weaker. A `304` does not consume a rate-limit token.

        Pinned posts are returned ahead of the ordered page and are excluded from the cursor.
      parameters:
        - $ref: "#/components/parameters/BoardIdPath"
        - name: tab
          in: query
          schema: { type: string, enum: [hot, new, poll, unanswered], default: hot }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Feed page.
          headers:
            Cache-Control:
              schema: { type: string, examples: ["private, max-age=60"] }
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostPage" }
              examples:
                hot:
