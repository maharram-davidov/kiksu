    post:
      tags: [forum]
      operationId: createComment
      summary: Comment on a thread
      description: |
        Alias allocation happens **inside the same transaction as the content insert**. A
        rolled-back insert frees the ordinal, so there is no such thing as an orphaned
        allocation.

        If the caller holds a live reservation from `alias-preview`, that ordinal is used and
        the promise the composer made is kept. If the reservation lapsed, the write **still
        succeeds** with a freshly allocated ordinal and the response carries the actual
        `author.alias_number` — the client renders what the response says, not what it
        previewed.

        A retried request with the same `Idempotency-Key` does not allocate a second
        ordinal; neither does one that slips past the idempotency record, because
        `internal.thread_alias`'s `(post_id, app_user_id)` key returns the existing ordinal.
      parameters:
        - $ref: "#/components/parameters/PostIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 10000 }
                parent_id: { type: string, format: uuid }
            examples:
              reply:
                value:
                  body: "Mən də eşitmişəm, amma rəsmi elan görmədim."
                  parent_id: "0193f3e0-b3c4-7d5a-f708-91021324a5b6"
      responses:
        "201":
          description: Created, with the ordinal actually assigned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`post_locked`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /posts/{post_id}/alias-preview:
    post:
      tags: [forum]
      operationId: reserveAliasPreview
      summary: "Reserve the alias the composer will use (\"ANONİM 5 KİMİ YAZ\")"
      description: |
        Implements `02-identity-spec.md` §3.3. The composer footer makes a **promise before
        the write**, so this is a reservation, not a prediction.

        - **Takes no user parameter.** The caller is bound from the token inside a privileged
          function. There is no form of this call that answers "what ordinal does someone
          *else* have".
        - **Consumes an ordinal**, with a TTL. That is what makes the promise real.
        - **Idempotent.** Re-calling it for the same thread extends the existing reservation
          rather than consuming another ordinal, so the composer can re-issue it on app
          resume and on typing heartbeats. The client should treat `expires_at` as
          authoritative and re-issue before it lapses.
        - If the caller has **already commented** in this thread, it returns that ordinal
          with `is_existing: true` and `expires_at: null`. Nothing is consumed and nothing is
          held: a person maps to exactly one ordinal per thread, forever.
        - `composer_cta` is returned **already localised**, because `ANONİM 5 KİMİ YAZ` is
          grammar, not concatenation.

        Rate limited per thread (`forum.alias_preview`) because preview is one of only two
        readers of the alias map, and access-logged for the same reason.

        A lapsed reservation leaves **no permanent gap**: the ordinal returns to the thread's
        pool. A reader may briefly see `1, 2, 3, 4, 6` while 5 is held. This is expected, is
        not an error, and is a small privacy gain — it breaks the strict correspondence
        between ordinal and arrival order.
      parameters:
        - $ref: "#/components/parameters/PostIdPath"
      responses:
        "200":
          description: Reserved (or the caller's existing ordinal).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AliasPreview" }
              examples:
                fresh:
                  summary: A new participant reserves ordinal 5
                  value:
                    post_id: "0193f3c0-e0f1-7a27-c4d5-6e7f80910213"
                    alias_number: 5
                    alias_label: "ANONİM 5"
                    composer_cta: "ANONİM 5 KİMİ YAZ"
                    state: "reserved"
                    is_existing: false
                    expires_at: "2026-08-15T09:25:00Z"
                existing:
                  summary: Already commented — ordinal 2, nothing consumed
                  value:
                    post_id: "0193f3c0-e0f1-7a27-c4d5-6e7f80910213"
                    alias_number: 2
                    alias_label: "ANONİM 2"
                    composer_cta: "ANONİM 2 KİMİ YAZ"
                    state: "active"
                    is_existing: true
                    expires_at: null
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`post_locked`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
    delete:
      tags: [forum]
      operationId: releaseAliasPreview
      summary: Release the reservation when the composer is dismissed
      description: |
        Optional — the background sweep reclaims abandoned holds every minute. Calling it is
        good citizenship: it returns the ordinal immediately instead of after the TTL.

        Releasing an ordinal that has already been used by a published comment is a no-op.
      parameters:
        - $ref: "#/components/parameters/PostIdPath"
      responses:
        "204": { description: Released, or nothing was held. }
        "404": { $ref: "#/components/responses/NotFound" }

