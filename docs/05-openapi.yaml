                        exams_start_on: "2025-05-26"
                        is_current: false

  /catalogue/courses:
    get:
      tags: [catalogue]
      operationId: searchCourses
      summary: Course catalogue search
      description: |
        Full-text plus trigram over the folded title and code. Folding maps
        `ə→e ğ→g ı→i ö→o ş→s ü→u ç→c`, so `"verilenler"` matches
        `"Verilənlər bazası sistemləri"` and `"Eliyeva"` matches `"Əliyeva"`. The query is
        folded identically to the index — folding one side only is the classic way to break
        Azerbaijani search.

        Scoped to the caller's university.
      parameters:
        - name: q
          in: query
          schema: { type: string, minLength: 2, examples: ["verilenler"] }
        - name: department_id
          in: query
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Courses.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoursePage" }
              examples:
                cs214:
                  value:
                    items:
                      - id: "0193f350-a0b1-7c2d-e3f4-5a6b7c8d9e0f"
                        code: "CS 214"
                        title: "Verilənlər bazası sistemləri"
                        short_title: "Verilənlər bazası"
                        credits: 6
                        level: 2
                        department_name: "İnformatika kafedrası"
                        review_summary:
                          review_count: 61
                          rating_avg: 4.2
                    page_info: { next_cursor: null, has_more: false }
        "429": { $ref: "#/components/responses/RateLimited" }

  /catalogue/courses/{course_id}:
    get:
      tags: [catalogue]
      operationId: getCourse
      summary: One course
      parameters:
        - $ref: "#/components/parameters/CourseIdPath"
      responses:
        "200":
          description: Course.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
        "404": { $ref: "#/components/responses/NotFound" }

  /catalogue/courses/{course_id}/sections:
    get:
      tags: [catalogue]
      operationId: listCourseSections
      summary: Sections of a course in a term
      description: |
        Enrollment, absence, timetable and coursework all hang off the **section**, not the
        course. Each section carries its meetings so the client can show a preview of the
        week impact before enrolling.
      parameters:
        - $ref: "#/components/parameters/CourseIdPath"
        - name: term_id
          in: query
          schema: { type: string, format: uuid }
          description: Defaults to the caller's current term.
      responses:
        "200":
          description: Sections.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CourseSection" }
              examples:
                cs214:
                  value:
                    items:
                      - id: "0193f360-b1c2-7d3e-f4a5-6b7c8d9e0f1a"
                        section_code: "1"
                        lang: "az"
                        capacity: 40
                        enrolled_count: 38
                        primary_instructor:
                          id: "0193f370-c2d3-7e4f-a5b6-7c8d9e0f1a2b"
                          full_name: "Nigar Əliyeva"
                          title_prefix: "dos."
                          initials: "NƏ"
                          department_name: "İnformatika kafedrası"
                        meetings:
                          - id: "0193f380-d3e4-7f50-b6c7-8d9e0f1a2b3c"
                            weekday: 2
                            weekday_label: "Ç.A"
                            starts_at: "14:05"
                            ends_at: "15:25"
                            kind: "lecture"
                            parity: "every"
                            room: { code: "312", campus_name: "II korpus" }
                          - id: "0193f381-e4f5-7a61-c7d8-9e0f1a2b3c4d"
                            weekday: 4
                            weekday_label: "C.A"
                            starts_at: "09:00"
                            ends_at: "10:20"
                            kind: "lab"
                            parity: "every"
                            room: { code: "L-3", campus_name: "Baş korpus" }
        "404": { $ref: "#/components/responses/NotFound" }

  /catalogue/instructors:
    get:
      tags: [catalogue]
      operationId: searchInstructors
      summary: Instructor search
      description: |
        Instructor names are **real and public** — this is a professor-review product.
        Instructors are not `app_user`s and are never linked to one. This endpoint has no
        relationship to handle search and no relationship to the k-anonymity floor.
      parameters:
        - name: q
          in: query
          schema: { type: string, minLength: 2, examples: ["Eliyeva"] }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Instructors.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstructorPage" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ==================================================================
  # TIMETABLE
  # ==================================================================

  /enrollments:
    get:
      tags: [timetable]
      operationId: listEnrollments
      summary: The caller's enrollments, with attendance
      description: |
        Own rows only, by RLS. Each entry embeds the attendance state that screen 04 renders
        as the `4 / 12` ring.
      parameters:
        - name: term_id
          in: query
          schema: { type: string, format: uuid }
          description: Defaults to the current term.
        - name: state
          in: query
          schema: { type: string, enum: [enrolled, dropped, completed, failed] }
      responses:
        "200":
          description: Enrollments.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Enrollment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [timetable]
      operationId: createEnrollment
      summary: Enroll in a section
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [section_id]
              properties:
                section_id: { type: string, format: uuid }
                color: { $ref: "#/components/schemas/AccentColor" }
      responses:
        "201":
          description: Enrolled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enrollment" }
        "409":
          description: "`already_enrolled`, `section_full` or `term_closed`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /enrollments/{enrollment_id}:
    patch:
      tags: [timetable]
      operationId: updateEnrollment
      summary: Change colour, order, state or recorded grade
      description: |
        `color` is the student's own choice and is why it lives on the enrollment rather
        than the course — two students may colour the same section differently.

        `final_letter` is validated against this university's `ref.grade_scale`; the server
        derives `gpa_points` from the scale rather than accepting them from the client.
      parameters:
        - name: enrollment_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                color: { $ref: "#/components/schemas/AccentColor" }
                display_order: { type: integer }
                state: { type: string, enum: [enrolled, dropped, completed, failed] }
                final_score: { type: number, minimum: 0, maximum: 100 }
                final_letter: { type: string, examples: ["A"] }
            examples:
              recolour:
                value: { color: "pomegranate" }
              grade:
                value: { final_letter: "A", final_score: 92 }
      responses:
        "200":
          description: Updated enrollment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enrollment" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: "`validation_failed` or `grade_scale_unknown`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [timetable]
      operationId: deleteEnrollment
      summary: Remove an enrollment
      parameters:
        - name: enrollment_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Removed. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`term_closed`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /timetable/week:
    get:
      tags: [timetable]
      operationId: getWeekTimetable
      summary: The week grid
      description: |
        Screen 03: Mon–Fri (`B.E Ç.A Ç C.A C`), 80-minute blocks. One join —
        `enrollment(app_user_id, state)` → `section_meeting(section_id, weekday)` — with no
        per-cell lookup.

        Exceptions (`cancelled`, `moved`, `extra`) are already applied and are reported as
        `status` plus, where relevant, the replacement room and times. Odd/even-week parity
        is resolved server-side against the university's calendar so the client never
        computes week numbers.

        **This endpoint is own-timetable only.** Sharing a timetable with classmates is a
        separate, free/busy-only surface: a set of six course sections is very close to a
        primary key for a student (`02-identity-spec.md` T10), so course ids, codes, rooms
        and instructors are never shared. That surface is not in the Phase 1 scope.
      parameters:
        - name: week_of
          in: query
          required: true
          schema: { type: string, format: date, examples: ["2025-10-27"] }
          description: Any date in the wanted week; the server snaps to Monday in the university's timezone.
      responses:
        "200":
          description: The week.
          content:
