  /posts/{post_id}/comments:
    get:
      tags: [forum]
      operationId: listComments
      summary: Comment thread
      description: |
        One level of nesting with a rail, ordered by the materialised `path` — a plain btree
        scan, already sorted, with no recursive CTE.

        **Deleted comments are returned in place**, keeping their ordinal, with
        `moderation_state: "removed"`, a `deleted_label` of `silinib` and no body. Ordinals
        are never renumbered. Removing them would turn `1, 2, 4, 5` into evidence that
        participant 3 said something removable, and would let anyone who saw the original
        attribute it (`02-identity-spec.md` T16, assertion 46).

        **Gaps in the ordinal sequence are normal** and carry no meaning the client should
        render: an ordinal may be held by an open composer and appear later, out of
        chronological order.
      parameters:
