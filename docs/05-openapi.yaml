  /reviews/access:
    get:
      tags: [reviews]
      operationId: getReviewAccess
      summary: The contribution wall, as queryable state
      description: |
        **The wall is a state the client can ask for, not a 403 it discovers.**

        Deciding whether a student has contributed this semester requires
        `internal.review_author`, which RLS may not touch, so the wall is a server-layer
        rule (`01-schema-notes.md`). A server-layer rule surfaced only as an error becomes a
        surprise; surfaced as state, it becomes a product feature — the client can render
        the contribution prompt, with the caller's own reviewable sections already listed,
        before they ever tap a walled surface.

        `state` is a closed enum:
        - `granted` — written reviews are readable.
        - `walled` — the caller has not contributed this term. Aggregates remain readable.
        - `blocked` — a `review_ban` sanction is in force. **Contributing does not lift it.**

        `reviewable_sections` is derived from the caller's own enrollments and is therefore
        own-data, not a cohort. No count of other people appears anywhere in this response.
      responses:
        "200":
          description: Access state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewAccess" }
              examples:
                walled:
                  value:
                    state: "walled"
                    term: { id: "0193f340-8b9c-7d0e-f5b6-2a3b4c5d6e7f", label: "2025/26 Payız" }
                    required_contributions: 1
                    written_contributions: 0
                    unlocked_until: null
                    message: "Rəyləri oxumaq üçün bu semestr bir rəy yaz."
                    reviewable_sections:
                      - section_id: "0193f360-b1c2-7d3e-f4a5-6b7c8d9e0f1a"
                        course_id: "0193f350-a0b1-7c2d-e3f4-5a6b7c8d9e0f"
                        course_code: "CS 214"
                        course_title: "Verilənlər bazası sistemləri"
                        instructor_id: "0193f370-c2d3-7e4f-a5b6-7c8d9e0f1a2b"
                        instructor_name: "dos. Nigar Əliyeva"
                        term_label: "2025/26 Payız"
                        already_written: false
                granted:
                  value:
                    state: "granted"
                    term: { id: "0193f340-8b9c-7d0e-f5b6-2a3b4c5d6e7f", label: "2025/26 Payız" }
                    required_contributions: 1
                    written_contributions: 1
                    unlocked_until: "2026-01-24T23:59:59+04:00"
                    message: null
                    reviewable_sections: []
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /reviews:
    get:
      tags: [reviews]
      operationId: listReviews
      summary: Written reviews for an instructor or a course
      description: |
        **Returns `200` even when the caller is walled** — with `items: []` and the same
        `access` object `GET /reviews/access` would return, so the client renders the
        contribution prompt from a response it already has, with no error path and no extra
        round trip. It does **not** return `403`.

        **Reviews carry no author field at all** — not `null`, not `"anonymous"`, absent.
        The design renders `ANONİM · DOĞRULANMIŞ` and nothing else. Reviews are the one
        surface that renders neither an alias nor a handle.

        `is_enrollment_verified` is gated: it can only be `true` when the section cohort at
        write time met the university's k-anonymity floor. On a small section an enrolled
        verified reviewer *is* identifiable, so the badge is suppressed and `false` is
        returned with no indication that suppression occurred.

        `term` may be absent on an individual review for the same reason (review cohort
        smallness). Its threshold, `k_review`, is unresolved — see
        `05-api-conventions.md` Open question 6.
      parameters:
        - name: instructor_id
          in: query
          schema: { type: string, format: uuid }
        - name: course_id
          in: query
          schema: { type: string, format: uuid }
        - name: sort
          in: query
          schema: { type: string, enum: [recent, helpful], default: recent }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Reviews, or the wall state with an empty list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewPage" }
              examples:
                granted:
                  summary: Access granted
                  value:
                    access:
                      state: "granted"
                      term: { id: "0193f340-8b9c-7d0e-f5b6-2a3b4c5d6e7f", label: "2025/26 Payız" }
                      required_contributions: 1
                      written_contributions: 1
                      unlocked_until: "2026-01-24T23:59:59+04:00"
                      message: null
                      reviewable_sections: []
                    items:
                      - id: "0193f3f0-d6e7-7a8d-c03b-24a5b6c7d8e9"
                        course: { id: "0193f350-a0b1-7c2d-e3f4-5a6b7c8d9e0f", code: "CS 214", title: "Verilənlər bazası sistemləri" }
                        instructor: { id: "0193f370-c2d3-7e4f-a5b6-7c8d9e0f1a2b", full_name: "Nigar Əliyeva", title_prefix: "dos." }
                        term: { id: "0193f341-9c0d-7e1f-a6c7-3b4c5d6e7f80", label: "2024/25 Yaz" }
                        overall_rating: 4
                        quality: 5
                        fairness: 4
                        workload: 3
                        attendance_strictness: 5
                        tags:
                          - { key: "slides_clear", label: "Slaydlar aydın", polarity: "positive" }
                          - { key: "attendance_strict", label: "Yoxlama sıx", polarity: "negative" }
                        body: "Slaydlar çox aydındır, laboratoriyalar imtahana birbaşa kömək edir. Davamiyyəti sərt yoxlayır, gec gəlməyin."
                        lang: "az"
                        is_enrollment_verified: true
                        helpful_count: 23
                        my_helpful: false
                        time_bucket: "days_n"
                        time_label: "3 gün"
                        moderation_state: "visible"
                    page_info: { next_cursor: null, has_more: false }
                walled:
                  summary: Walled — 200 with an empty list, never 403
                  value:
                    access:
                      state: "walled"
                      term: { id: "0193f340-8b9c-7d0e-f5b6-2a3b4c5d6e7f", label: "2025/26 Payız" }
                      required_contributions: 1
                      written_contributions: 0
                      unlocked_until: null
                      message: "Rəyləri oxumaq üçün bu semestr bir rəy yaz."
                      reviewable_sections:
                        - section_id: "0193f360-b1c2-7d3e-f4a5-6b7c8d9e0f1a"
                          course_id: "0193f350-a0b1-7c2d-e3f4-5a6b7c8d9e0f"
                          course_code: "CS 214"
                          course_title: "Verilənlər bazası sistemləri"
                          instructor_id: "0193f370-c2d3-7e4f-a5b6-7c8d9e0f1a2b"
                          instructor_name: "dos. Nigar Əliyeva"
                          term_label: "2025/26 Payız"
                          already_written: false
                    items: []
                    page_info: { next_cursor: null, has_more: false }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      tags: [reviews]
      operationId: createReview
      summary: Write a review
      description: |
        Keyed `course × instructor × semester`, with the four fixed criteria the design
        renders as four labelled bars. One review per student per key, enforced by
        `internal.review_author`'s unique constraint — a second attempt is
        `409 review_already_written`.

        This is the **only** reviews endpoint that returns `403 review_wall_active`, and only
        as a backstop for a client that ignored `GET /reviews/access`.

        The response carries the refreshed `access` object, so a client that was walled
        before this call renders as unwalled immediately afterwards without a second request.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewInput" }
            examples:
              cs214:
                value:
                  course_id: "0193f350-a0b1-7c2d-e3f4-5a6b7c8d9e0f"
                  instructor_id: "0193f370-c2d3-7e4f-a5b6-7c8d9e0f1a2b"
                  term_id: "0193f341-9c0d-7e1f-a6c7-3b4c5d6e7f80"
                  overall_rating: 4
                  quality: 5
                  fairness: 4
                  workload: 3
                  attendance_strictness: 5
                  tag_keys: ["slides_clear", "attendance_strict"]
                  body: "Slaydlar çox aydındır, laboratoriyalar imtahana birbaşa kömək edir."
                  lang: "az"
      responses:
        "201":
          description: Created, with the refreshed wall state.
          content:
            application/json:
              schema:
                type: object
                required: [review, access]
                properties:
                  review: { $ref: "#/components/schemas/Review" }
                  access: { $ref: "#/components/schemas/ReviewAccess" }
        "403":
          description: "`review_wall_active`, `verification_required` or `sanction_active`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`review_already_written` or `review_term_not_reviewable`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                already:
                  value:
                    error:
                      code: "review_already_written"
                      message: "Bu fənn və müəllim üçün bu semestrdə artıq rəy yazmısan."
                      message_key: "err.review_already_written"
                      action: "none"
                      action_label: null
                      details: {}
                      request_id: "01JAV2H6Y4WS1Z3DJ5C39T0H2K"
        "422":
          description: "`validation_failed` or `review_tag_unknown`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /reviews/{review_id}/helpful:
    put:
      tags: [reviews]
      operationId: markReviewHelpful
      summary: Mark a review helpful
      description: Idempotent; takes no `Idempotency-Key`. Own row only, by RLS.
      parameters:
        - $ref: "#/components/parameters/ReviewIdPath"
      responses:
        "200":
          description: Marked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  my_helpful: { type: boolean }
                  helpful_count: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [reviews]
      operationId: unmarkReviewHelpful
      summary: Remove a helpful mark
      parameters:
        - $ref: "#/components/parameters/ReviewIdPath"
      responses:
        "200":
          description: Unmarked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  my_helpful: { type: boolean }
                  helpful_count: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }

components:

  securitySchemes:
    supabaseJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Supabase-issued access token, RS256, 900 s TTL, refresh-token rotation with reuse
        detection.

        **Trusted claims** (`05-api-conventions.md` §2.2): `sub`, and from `app_metadata`
        only — `app_user_id`, `tier`, `role`, `univ_id`, `epoch`, `sid`.

        **Never trusted:** `user_metadata` / `raw_user_meta_data` in any form. It is
        **client-writable** through the standard Supabase update-user call and it lands in
        the JWT correctly signed. A policy that trusts `user_metadata.tier` grants every user
        the ability to award themselves the `ANONİM KART` badge. Also never trusted: `email`,
        `phone`, or any claim naming faculty, entry year, study year, handle, karma or a
        career reference.

        Never present the token in a URL.

  parameters:

    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema: { type: string, enum: ["az", "ru", "en"], default: "az" }
      description: Negotiates localised strings and error messages. Default `az`.

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: |
        Client-generated UUIDv4, one per logical user intent — generated when the composer
        opens, not when the request fires, so a retry after a network failure reuses it.
        Scoped to `(app_user_id, method, path, key)`, retained 24 h. A replay returns the
        stored response with `Idempotency-Replayed: true`.

    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      description: Clamped, never rejected.

    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
      description: |
        **Opaque.** Present it back exactly as received. It is an HMAC-signed keyset tuple
        bound to the endpoint and to every sort/filter parameter; a modified or hand-crafted
        cursor returns `400 cursor_invalid`, which is what stops cursor-crafting being used
        as a scan primitive against forum publication times. Passing `cursor` together with a
        changed `tab`/`sort`/`q`/filter is also `cursor_invalid`. Cursors expire after
        15 minutes. Never parse it.

    UniversityIdPath:
      name: university_id
      in: path
      required: true
      schema: { type: string, format: uuid }

    CourseIdPath:
      name: course_id
      in: path
      required: true
      schema: { type: string, format: uuid }

    BoardIdPath:
      name: board_id
      in: path
      required: true
      schema: { type: string, format: uuid }

    PostIdPath:
      name: post_id
      in: path
      required: true
      schema: { type: string, format: uuid }

    CommentIdPath:
      name: comment_id
      in: path
      required: true
      schema: { type: string, format: uuid }

    ReviewIdPath:
      name: review_id
      in: path
      required: true
      schema: { type: string, format: uuid }

  headers:
    RateLimitLimit:
      description: Requests permitted in the current window for the scarcest applicable bucket.
      schema: { type: integer }
    RateLimitRemaining:
      description: Requests remaining in that bucket.
      schema: { type: integer }
    RateLimitReset:
      description: Seconds until that bucket resets. A delta, never an absolute time.
      schema: { type: integer }
    RateLimitPolicy:
      description: Named policy, e.g. `"forum-write";q=15;w=86400`. Names the bucket, never the principal.
      schema: { type: string }
    RetryAfter:
      description: Seconds to wait. Clients must honour it and must not busy-retry.
      schema: { type: integer }
    IdempotencyReplayed:
      description: Present and `true` when this response was replayed from a stored idempotency record.
      schema: { type: boolean }
    RequestId:
      description: Echoes `error.request_id`. The support path.
      schema: { type: string }

  responses:

    Unauthenticated:
      description: "`unauthenticated`, `token_stale` or `token_invalid`. On `token_stale` the client refreshes and retries once, silently."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            stale:
              value:
                error:
                  code: "token_stale"
                  message: "Sessiya yeniləndi. Yenidən cəhd edirik."
                  message_key: "err.token_stale"
                  action: "refresh_token"
                  action_label: null
                  details: {}
                  request_id: "01JAV2H7Z5XT2A4EK6D4AU1J3M"

    Forbidden:
      description: |
        `forbidden`, `verification_required`, `verification_expired`, `tier_insufficient`,
        `sanction_active`, `account_suspended`, `account_banned` or `not_campus_member`.
        `forbidden` is deliberately uninformative; where the *existence* of a resource is
        sensitive the API returns `404` instead.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            needsVerification:
              value:
                error:
                  code: "verification_required"
                  message: "Bunun üçün tələbə doğrulaması lazımdır."
                  message_key: "err.verification_required"
                  action: "verify_email"
                  action_label: "E-poçtu doğrula"
                  details: {}
                  request_id: "01JAV2H806YU3B5FL7E5BV2K4N"

    NotFound:
      description: |
        `not_found`. Also returned where a `403` would be an existence oracle — another
        user's saved post, another user's enrollment, a non-discoverable or quarantined
        handle.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    Conflict:
      description: "`conflict` or a domain-specific 409 from the closed code set."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    ValidationFailed:
      description: "`validation_failed`, with `details.fields`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            range:
              value:
                error:
                  code: "validation_failed"
                  message: "Qiymətləndirmə 1 ilə 5 arasında olmalıdır."
                  message_key: "err.validation_failed"
                  action: "none"
                  action_label: null
                  details:
                    fields:
                      - { path: "overall_rating", rule: "range", min: 1, max: 5 }
                  request_id: "01JAV2H917ZV4C6GM8F6CW3L5P"

    RateLimited:
      description: "`rate_limited` and its domain-specific siblings. Honour `Retry-After`."
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
        RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
        RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
        RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
        RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            slowDown:
              value:
                error:
                  code: "rate_limited"
                  message: "Çox sürətli göndərirsən. 3 dəqiqədən sonra yenidən cəhd et."
                  message_key: "err.rate_limited"
                  action: "retry_after"
                  action_label: null
                  details: {}
                  request_id: "01JAV2HA280W5D7HN9G7DX4M6Q"

    PayloadTooLarge:
      description: "`payload_too_large`, with `details.max_bytes`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    UnsupportedMediaType:
      description: "`unsupported_media_type`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    InternalError:
      description: "`internal_error`, `service_unavailable` or `dependency_timeout`. Never names the failing dependency."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:

    # ---------- primitives ----------

    LocaleCode:
      type: string
      enum: [az, ru, en]
      description: Default `az`.

    AccentColor:
      type: string
      enum: [turquoise, bronze, pomegranate, indigo, ink, moss, plum]
      description: Timetable block colour, chosen by the student per enrollment.
      x-kiksu-enum: open

    PostKind:
      type: string
      enum: [text, image, link, poll]
      x-kiksu-enum: open

    AbsenceKind:
      type: string
      enum: [absent, late, excused]
      x-kiksu-enum: open

    CourseworkKind:
      type: string
      enum: [homework, lab, project, quiz, midterm, final, presentation, other]
      x-kiksu-enum: open

    MeetingKind:
      type: string
      enum: [lecture, seminar, lab, exam, consultation]
      x-kiksu-enum: open

    ModerationState:
      type: string
      enum: [visible, pending_review, limited, removed]
      x-kiksu-enum: open

    VerificationStatusCoarse:
      type: string
      enum: [card, email, none]
      description: |
        The **only** verification value that may cross between users. Coarse by design:
        `public.public_profiles` maps `card_verified` → `card`, `email_verified` → `email`,
        everything else → `none`. The fine-grained `verification_tier` and
        `card_review_state` never cross — a pending card review is a real-world event with a
        knowable timestamp.

    TimeBucket:
      type: string
      enum: [just_now, min_30, hour_1, hours_n, days_n, date]
      description: |
        Coarse age of anonymous content. **Anonymous content never carries a raw timestamp.**
        A post naming an instructor, rendered at 5-minute resolution, is timeable to the class
        that just ended and therefore narrows the author to the ~30 people who attended
        (`02-identity-spec.md` T9).
      x-kiksu-enum: open

    PageInfo:
      type: object
      required: [next_cursor, has_more]
      properties:
        next_cursor:
          type: [string, "null"]
          description: Opaque. `null` exactly when `has_more` is false.
        has_more:
          type: boolean
          description: |
            The loop condition. Never infer the end from an empty `items` array — a page can
            legitimately come back short after moderation filtering.
      description: No `total_count` exists anywhere in this API. A total is an expensive scan, and on people-shaped collections it is a cohort count.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, message_key, request_id]
          properties:
            code:
              type: string
              description: From the closed set in `05-api-conventions.md` §3.3. Safe to `switch` on.
            message:
              type: string
              description: Localised, student-facing, actionable. Never a stack trace, a constraint name, an internal service name or an identifier.
            message_key:
              type: string
              description: Stable key into the client's own catalogue. The client prefers its own string when it knows the key, which is what makes adding a code non-breaking for old builds.
            action:
              type: [string, "null"]
              enum: [none, retry, retry_after, sign_in, refresh_token, verify_email, verify_card, upgrade_app, open_settings, wait_cooldown, contact_support, null]
            action_label: { type: [string, "null"] }
            details:
              type: object
              additionalProperties: true
              description: |
                Code-specific. **Never contains a count of people** — not a cohort size, not a
                follower count below 1,000, not a "you are one of N" hint
                (`02-identity-spec.md` assertion 35).
            request_id: { type: string }
            store_url:
              type: [string, "null"]
              description: Present only on `client_version_unsupported`, whose shape is frozen forever.

    # ---------- meta ----------

    Bootstrap:
      type: object
      required: [min_supported_client, recommended_client, api_versions, locales]
      properties:
        min_supported_client:
          type: object
          properties:
            ios: { type: string, examples: ["1.2.0"] }
            android: { type: string, examples: ["1.2.0"] }
        recommended_client:
          type: object
          properties:
            ios: { type: string, examples: ["1.4.2"] }
            android: { type: string, examples: ["1.4.2"] }
        api_versions:
          type: array
          items:
            type: object
            properties:
              version: { type: string, examples: ["v1"] }
              sunset_at: { type: [string, "null"], format: date-time }
        store_urls:
          type: object
          properties:
            ios: { type: string }
            android: { type: string }
        locales:
          type: object
          properties:
            supported:
              type: array
              items: { $ref: "#/components/schemas/LocaleCode" }
            default: { $ref: "#/components/schemas/LocaleCode" }
        flags:
          type: object
          additionalProperties: true
          description: Server-owned feature flags. Never contains anything user-specific.
        copy_overrides:
          type: object
          additionalProperties: { type: string }
          description: |
            Strings the client must prefer over its bundled copy. This is how the
            verification SLA claim can stop saying `2 dəqiqə` within two hours of the
            measured p95 breaching it, without an app-store release.

    # ---------- onboarding ----------

    University:
      type: object
      required: [id, code, name, city]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: ["BDU"] }
        name: { type: string, examples: ["Bakı Dövlət Universiteti"] }
        city: { type: string, examples: ["Bakı"] }
        brand_color: { type: [string, "null"], examples: ["#0F7A85"] }
        logo_url: { type: [string, "null"] }
        email_sample_pattern:
          type: [string, "null"]
          examples: ["ad.soyad@std.bsu.edu.az"]
          description: From `ref.university_email_domain.sample_pattern`, shown as a hint in the address field.

    VerificationRoute:
      type: object
      required: [method, is_recommended, sla_label, display_order]
      properties:
        method: { type: string, enum: [university_email, student_card, invite_code] }
        is_recommended:
          type: boolean
          description: At most one per university — the design's `TÖVSİYƏ` badge.
        sla_label:
          type: string
          description: |
            **Server-authored and flag-gated.** Reverts from `2 dəqiqə` / `24 saata qədər`
            to the measured value when the SLA is being missed. The client renders what it
            is given (`02-identity-spec.md` §2.1, §2.2 honesty rules).
          examples: ["2 dəqiqə"]
        note: { type: [string, "null"] }
        sample_pattern: { type: [string, "null"] }
        display_order: { type: integer }

    OtpChallengeAccepted:
      type: object
      required: [attempt_id, expires_at, message]
      properties:
        attempt_id: { type: string, format: uuid }
        expires_at:
          type: string
          format: date-time
          description: 10-minute TTL.
        resend_available_at:
          type: string
          format: date-time
          description: 60-second cooldown.
        message: { type: string, examples: ["Kod göndərildi. Poçtunu yoxla."] }
      description: |
        Byte-identical for a fresh address, an already-registered address and a banned
        address. Before the caller has proved control of the mailbox, every response is the
        same one.

    VerificationGranted:
      type: object
      required: [tier, verification_status, token_refresh_required]
      properties:
        tier: { type: string, enum: [provisional, email, card] }
        verification_status: { $ref: "#/components/schemas/VerificationStatusCoarse" }
        handle:
          type: [string, "null"]
          description: Generated on first grant. Never chosen by the client.
          examples: ["sakit-pərvanə-37"]
        token_refresh_required:
          type: boolean
          description: |
            Always `true`. The grant transaction increments the identity epoch, so the
            caller's current token is stale and the next request would return
            `401 token_stale` regardless.
        provisional_expires_at:
          type: [string, "null"]
          format: date-time
          description: Route C only. Seven days, after which the account reverts to read-only unless a real verification completes.
        message: { type: [string, "null"] }

    CardSubmissionAccepted:
      type: object
      required: [attempt_id, state, sla_label]
      properties:
        attempt_id: { type: string, format: uuid }
        state: { type: string, enum: [pending, in_review, rejected, verified] }
        sla_due_at: { type: [string, "null"], format: date-time }
        sla_label: { type: string, examples: ["24 saata qədər"] }
        message: { type: [string, "null"] }

    VerificationStatus:
      type: object
      required: [tier, verification_status, routes]
      properties:
        tier: { type: string, enum: [provisional, email, card, expired, suspended] }
        verification_status: { $ref: "#/components/schemas/VerificationStatusCoarse" }
        routes:
          type: array
          description: One entry per route. Screen 10 renders several simultaneously.
          items:
            type: object
            required: [method, state, label]
            properties:
              method: { type: string, enum: [university_email, student_card, invite_code] }
              state: { type: string, enum: [none, pending, in_review, verified, rejected, expired, revoked] }
              label:
                type: string
                description: "Localised, e.g. `E-poçt doğrulandı`, `Kart: gözləyir`."
              valid_until: { type: [string, "null"], format: date-time }
              reverification_due:
                type: [boolean, "null"]
                description: Cosmetic banner in the 30 days before expiry. No functional change.
              sla_due_at: { type: [string, "null"], format: date-time }
              reject_reason:
                type: [string, "null"]
                description: |
                  Localised. Suspected-forgery rejections return the **generic**
                  "doğrulaya bilmədik" — specific feedback teaches forgers what to fix.

    UploadTarget:
      type: object
      required: [upload_id, url, method, expires_at]
      properties:
        upload_id: { type: string, format: uuid }
        url:
          type: string
          description: |
            One-shot signed URL into a private bucket. The object key is ≥128 bits of
            randomness in a flat namespace — no user id, no thread id, no shared prefix
            between two uploads by the same person.
        method: { type: string, enum: [PUT, POST] }
        headers:
          type: object
          additionalProperties: { type: string }
        expires_at: { type: string, format: date-time }

    InviteCode:
      type: object
      required: [id, expires_at, state]
      properties:
        id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        state: { type: string, enum: [live, consumed, expired] }
        university_code: { type: string, examples: ["BDU"] }
      description: |
        Carries **nothing about the redeemer**. The invite edge is sealed, access-logged,
        never used for recommendations or notifications, and aggregated away after 30 days.

    InviteCodeIssued:
      allOf:
        - $ref: "#/components/schemas/InviteCode"
        - type: object
          required: [code]
          properties:
            code:
              type: string
              pattern: "^[0-9]{6}$"
              description: Returned exactly once, at issuance. Stored only as a keyed hash.
              examples: ["704318"]

    # ---------- session and profile ----------

    PublicProfile:
      type: object
      required: [id, handle, avatar_id, verification_status, contributor_level]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        handle:
          type: string
          description: Generated `adjective-noun-NN` from the curated Azerbaijani wordlist. Never chosen.
          examples: ["quru-püstə-19"]
        avatar_id:
          type: integer
          minimum: 0
          maximum: 11
          description: |
            Derived from the folded handle, never stored independently — so it **rotates with
            the handle**. An avatar that survived a rename would link the old handle to the
            new one and defeat the point of renaming.
        university_id:
          type: [string, "null"]
          format: uuid
          description: |
            Present only when the user opted in **and** their cohort is ≥ 20. Otherwise
            `null`, with no indication that suppression occurred and no count.
        verification_status: { $ref: "#/components/schemas/VerificationStatusCoarse" }
        contributor_level:
          type: integer
          minimum: 0
          maximum: 4
          description: |
            Coarse, super-linear buckets (50 / 250 / 1000 / 5000), **materialised and
            refreshed on a delay**, never within 24 h of the karma change that caused it.
            This replaces exact karma across users: an exact karma readable on demand lets an
            attacker poll a handle before and after a post appears and link that stable
            pseudonym to that anonymous post with certainty (`02-identity-spec.md` T5,
            assertions 22–23). The delay is the security control.
      description: |
        `public.public_profiles`, whole. **The only cross-user read of another person.**
        `additionalProperties: false` is load-bearing: adding a field here is a security
        change and must be reviewed as one.

    SessionUser:
      type: object
      required: [id, handle, avatar_id, verification_tier, status]
      properties:
        id: { type: string, format: uuid }
        handle: { type: string, examples: ["sakit-pərvanə-37"] }
        handle_number: { type: [integer, "null"], examples: [37] }
        avatar_id: { type: integer, minimum: 0, maximum: 11 }
        verification_tier: { type: string, enum: [unverified, email_verified, card_verified] }
        verification_status: { $ref: "#/components/schemas/VerificationStatusCoarse" }
        contributor_level: { type: integer, minimum: 0, maximum: 4 }
        university:
          type: [object, "null"]
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            name: { type: string }
        display_study_year:
          type: [integer, "null"]
          minimum: 1
          maximum: 8
          description: Absent when the privacy toggle is off **or** the cohort is below the floor. The two cases are indistinguishable, deliberately.
        display_faculty_label:
          type: [string, "null"]
          description: |
            A pre-rendered, already-generalised label. **Never a faculty id and never a
            programme.** Null when the (university, faculty, year) cohort did not meet the
            floor.
        karma:
          type: integer
          description: |
            Exact, and **own-row only** — from `public.app_user_card`, which is
            `security_invoker = on`. It appears in no cross-user surface at any tier.
        post_count: { type: integer, description: Own-row only. Never public — a +1 at time T narrows to the posts made at time T. }
        comment_count: { type: integer, description: Own-row only. }
        review_count: { type: integer, description: Own-row only. }
        locale: { $ref: "#/components/schemas/LocaleCode" }
        feed_languages:
          type: array
          items: { $ref: "#/components/schemas/LocaleCode" }
        status: { type: string, enum: [pending, active, muted, suspended, deactivated] }
        created_at:
          type: string
          format: date-time
          description: Own-row only. Never cross-user — account age correlates with join cohort.
        handle_change_allowed_at:
          type: string
          format: date-time
          description: The 14-day cooldown, enforced server-side. The client control is advisory.
        privacy: { $ref: "#/components/schemas/PrivacySettings" }

    PrivacySettings:
      type: object
      properties:
        show_year: { type: boolean, description: "`Kursumu profildə göstər`. Applied on top of the k-anonymity floor, never instead of it." }
        share_timetable: { type: boolean, description: "`Cədvəlimi kursdaşlarla paylaş`. Sharing is free/busy only on a ≥30-minute grid; course identities are never shared." }
        show_uni_badge: { type: boolean, description: "`Postlarımda universitet nişanı`." }
        link_listings: { type: boolean, description: "`Bazar profilimə keçid`." }
        discoverable: { type: boolean, description: "`Axtarışda tapılım`. Exact-handle lookup only, off by default." }

    BlockEntry:
      type: object
      required: [block_id, handle_at_block_time, scope, created_at]
      properties:
        block_id: { type: string, format: uuid }
        handle_at_block_time:
          type: string
          description: |
            A **snapshot**, never resolved live. Resolving live would turn the block list into
            a rename oracle: block many people, watch the list, learn the whole rename map.
          examples: ["quru-püstə-19"]
        scope: { type: string, enum: [forum, global] }
        created_at: { type: string, format: date-time }

    # ---------- catalogue ----------

    Term:
      type: object
      required: [id, label, season, starts_on, ends_on, is_current]
      properties:
        id: { type: string, format: uuid }
        label: { type: string, examples: ["2025/26 Payız"] }
        season: { type: string, enum: [payiz, yaz, yay] }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        add_drop_ends_on: { type: [string, "null"], format: date }
        exams_start_on: { type: [string, "null"], format: date }
        is_current: { type: boolean }

    Course:
      type: object
      required: [id, code, title]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: ["CS 214"] }
        title: { type: string, examples: ["Verilənlər bazası sistemləri"] }
        short_title: { type: [string, "null"], examples: ["Verilənlər bazası"], description: The grid label. }
        credits: { type: [number, "null"], examples: [6] }
        level: { type: [integer, "null"] }
        description: { type: [string, "null"] }
        department_name: { type: [string, "null"], examples: ["İnformatika kafedrası"] }
        review_summary:
          type: [object, "null"]
          description: From `public.course_review_summary`. Never walled.
          properties:
            review_count: { type: integer }
            rating_avg: { type: [number, "null"] }

    CoursePage:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Course" }
        page_info: { $ref: "#/components/schemas/PageInfo" }

    Instructor:
      type: object
      required: [id, full_name]
      properties:
        id: { type: string, format: uuid }
        full_name:
          type: string
          examples: ["Nigar Əliyeva"]
          description: Real and public. Instructors are not `app_user`s and are never linked to one.
        title_prefix: { type: [string, "null"], examples: ["dos."] }
        initials: { type: [string, "null"], examples: ["NƏ"], description: Rendered avatar. }
        department_name: { type: [string, "null"], examples: ["İnformatika kafedrası"] }
        university_code: { type: [string, "null"], examples: ["BDU"] }
        is_claimed: { type: boolean }
        rating_avg: { type: [number, "null"] }
        review_count: { type: [integer, "null"] }

    InstructorPage:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Instructor" }
        page_info: { $ref: "#/components/schemas/PageInfo" }

    Room:
      type: object
      properties:
        code: { type: string, examples: ["312"] }
        campus_name: { type: [string, "null"], examples: ["II korpus"] }

    SectionMeeting:
      type: object
      required: [id, weekday, starts_at, ends_at, kind]
      properties:
        id: { type: string, format: uuid }
        weekday:
          type: integer
          minimum: 1
          maximum: 7
          description: ISO-8601. 1 = Monday.
        weekday_label: { type: string, examples: ["Ç.A"], description: "`B.E Ç.A Ç C.A C` for Mon–Fri." }
        starts_at: { type: string, examples: ["14:05"], description: Local to the university timezone. }
        ends_at: { type: string, examples: ["15:25"] }
        kind: { $ref: "#/components/schemas/MeetingKind" }
        parity: { type: string, enum: [every, odd, even] }
        room: { $ref: "#/components/schemas/Room" }

    CourseSection:
      type: object
      required: [id, section_code]
      properties:
        id: { type: string, format: uuid }
        section_code: { type: string, examples: ["1"] }
        lang: { $ref: "#/components/schemas/LocaleCode" }
        capacity: { type: [integer, "null"] }
        enrolled_count: { type: integer, description: Counter cache, not a live COUNT(*). }
        primary_instructor: { $ref: "#/components/schemas/Instructor" }
        meetings:
          type: array
          items: { $ref: "#/components/schemas/SectionMeeting" }

    # ---------- timetable ----------

    Enrollment:
      type: object
      required: [id, section_id, state]
      properties:
        id: { type: string, format: uuid }
        section_id: { type: string, format: uuid }
        term_id: { type: string, format: uuid }
        state: { type: string, enum: [enrolled, dropped, completed, failed] }
        color: { $ref: "#/components/schemas/AccentColor" }
        display_order: { type: [integer, "null"] }
        course:
          type: object
          properties:
            id: { type: string, format: uuid }
            code: { type: string, examples: ["CS 214"] }
            title: { type: string, examples: ["Verilənlər bazası sistemləri"] }
            short_title: { type: [string, "null"] }
            credits: { type: [number, "null"] }
        instructor_name: { type: [string, "null"], examples: ["dos. Nigar Əliyeva"] }
        attendance: { $ref: "#/components/schemas/Attendance" }
        final_letter: { type: [string, "null"] }
        gpa_points: { type: [number, "null"] }

    Attendance:
      type: object
      required: [enrollment_id, absence_count, absence_units, absence_limit, state]
      properties:
        enrollment_id: { type: string, format: uuid }
        section_id: { type: string, format: uuid }
        course_code: { type: string, examples: ["CS 214"] }
        course_title: { type: [string, "null"] }
        absence_count: { type: integer, description: Raw count of recorded absences. }
        absence_units:
          type: number
          description: |
            Weighted total — a `late` contributes `late_counts_as` (default 0.5). This is
            what the `4 / 12` ring renders.
        absence_limit:
          type: integer
          description: |
            **Resolved server-side, never a client constant.**
            `section override → course policy → faculty policy → university policy →
            university default`.
          examples: [12]
        expulsion_at: { type: integer, description: Expulsion threshold. Usually equal to `absence_limit`. }
        used_ratio_pct: { type: integer, examples: [33], description: "Design: `İcazəli qayıb limitinin 33%-i istifadə olunub`." }
        warn_at_ratio_pct: { type: integer, examples: [50] }
        late_counts_as: { type: number, examples: [0.5] }
        state:
          type: string
          enum: [ok, warning, at_limit, over_limit]
          description: Derived from `absence_units` against `warn_at_ratio` and `expulsion_at`.

    Absence:
      type: object
      required: [id, enrollment_id, occurred_on, kind]
      properties:
        id: { type: string, format: uuid }
        enrollment_id: { type: string, format: uuid }
        meeting_id: { type: [string, "null"], format: uuid }
        occurred_on: { type: string, format: date }
        kind: { $ref: "#/components/schemas/AbsenceKind" }
        source: { type: string, enum: [self_reported, instructor, import] }
        excuse_state: { type: [string, "null"], enum: [none, requested, approved, rejected, null] }

    WeekTimetable:
      type: object
      required: [week_start, week_end, days]
      properties:
        week_start: { type: string, format: date }
        week_end: { type: string, format: date }
        term:
          type: object
          properties:
            id: { type: string, format: uuid }
            label: { type: string, examples: ["2025/26 Payız"] }
        days:
          type: array
          items:
            type: object
            required: [date, weekday, meetings]
            properties:
              date: { type: string, format: date }
              weekday: { type: integer, minimum: 1, maximum: 7 }
              weekday_label: { type: string, examples: ["Ç.A"] }
              meetings:
                type: array
                items:
                  type: object
                  required: [meeting_id, section_id, starts_at, ends_at, status]
                  properties:
                    meeting_id: { type: string, format: uuid }
                    section_id: { type: string, format: uuid }
                    enrollment_id: { type: string, format: uuid }
                    course_code: { type: string, examples: ["CS 214"] }
                    course_short_title: { type: [string, "null"], examples: ["Verilənlər bazası"] }
                    starts_at: { type: string, examples: ["14:05"] }
                    ends_at: { type: string, examples: ["15:25"] }
                    kind: { $ref: "#/components/schemas/MeetingKind" }
                    room: { $ref: "#/components/schemas/Room" }
                    instructor_name: { type: [string, "null"], examples: ["dos. Nigar Əliyeva"] }
                    color: { $ref: "#/components/schemas/AccentColor" }
                    status:
                      type: string
                      enum: [scheduled, cancelled, moved, extra]
                      description: Exceptions are already applied server-side; parity is already resolved.
                    note: { type: [string, "null"], examples: ["Dərs ləğv edildi."] }

    Deadline:
      type: object
      required: [id, section_id, kind, title, origin]
      properties:
        id: { type: string, format: uuid }
        section_id: { type: string, format: uuid }
        course_code: { type: string, examples: ["CS 214"] }
        course_short_title: { type: [string, "null"] }
        kind: { $ref: "#/components/schemas/CourseworkKind" }
        title: { type: string, examples: ["SQL laboratoriya #4"] }
        description: { type: [string, "null"] }
        due_at: { type: [string, "null"], format: date-time }
        due_label:
          type: [string, "null"]
          examples: ["Sabah 23:59"]
          description: |
            Localised. A raw `due_at` is also returned: a deadline is a property of a
            scheduled thing, not of a person's activity, so it is not subject to the coarse
            time rule.
        weight_pct: { type: [number, "null"] }
        origin: { type: string, enum: [official, crowdsourced, personal] }
        created_by:
          oneOf:
            - $ref: "#/components/schemas/PublicProfile"
            - type: "null"
          description: |
            Crowdsourced deadlines are attributed **by handle**, not by alias — adding a
            deadline is a reputational act and the design shows no anonymity affordance for
            it. Consequently this object carries no alias fields, ever.
        confirm_count: { type: integer }
        dispute_count: { type: integer }
        is_verified: { type: boolean }
        my_state: { type: string, enum: [todo, in_progress, done, skipped] }

    DeadlinePage:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Deadline" }
        page_info: { $ref: "#/components/schemas/PageInfo" }

    GpaSummary:
      type: object
      required: [scale_max, term, cumulative]
      properties:
        scale_max: { type: number, examples: [4], description: Maximum `gpa_points` in this university's `ref.grade_scale`. }
        term:
          type: object
          properties:
            term_id: { type: string, format: uuid }
            term_label: { type: string, examples: ["2024/25 Yaz"] }
            gpa: { type: [number, "null"] }
            credits_attempted: { type: number }
            credits_earned: { type: number }
            courses:
              type: array
              items:
                type: object
                properties:
                  section_id: { type: string, format: uuid }
                  course_code: { type: string }
                  course_title: { type: string }
                  credits: { type: [number, "null"] }
                  final_letter: { type: [string, "null"] }
                  gpa_points: { type: [number, "null"] }
        cumulative:
          type: object
          properties:
            gpa: { type: [number, "null"] }
            credits_attempted: { type: number }
            credits_earned: { type: number }
      description: |
        Computed server-side from `enrollment.gpa_points` weighted by `ref.course.credits`.
        No GPA column exists in the schema. Own data only — never comparable, never ranked,
        never returned for another user at any tier.

    # ---------- forum ----------

    Board:
      type: object
      required: [id, slug, name, scope, lang]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, examples: ["ders-ve-muellim"] }
        name: { type: string, examples: ["Dərs və müəllim"] }
        description: { type: [string, "null"] }
        scope: { type: string, enum: [national, university, faculty, course, club], x-kiksu-enum: open }
        university_id: { type: [string, "null"], format: uuid }
        university_code: { type: [string, "null"], examples: ["BDU"] }
        lang: { $ref: "#/components/schemas/LocaleCode" }
        follower_count:
          type: [integer, "null"]
          examples: [9214]
          description: |
            Returned **only above 1,000**. Below that the field is absent — not rounded,
            because a rounded count still moves, and a board's eligible membership is a
            cohort (`02-identity-spec.md` §5.4).
        post_count: { type: integer }
        min_tier_to_post: { type: string, enum: [unverified, email_verified, card_verified] }
        allows_poll: { type: boolean }
        allows_image: { type: boolean }
        is_following: { type: boolean, description: The caller's own row. }
        is_archived: { type: boolean }

    AliasAuthor:
      type: object
      required: [display_mode]
      additionalProperties: false
      properties:
        display_mode:
          type: string
          enum: [alias, handle, staff]
          description: |
            `alias` is the default and the design's only shown case. `handle` and `staff`
            appear on deliberately identified content (staff notices, club announcements),
            and in that case `profile` is present and every alias field is absent.
        alias_number: { type: [integer, "null"], minimum: 1, examples: [5] }
        alias_label: { type: [string, "null"], examples: ["ANONİM 5"], description: Localised. }
        tier_badge:
          type: [string, "null"]
          enum: [card, email, none, null]
          description: |
            **Frozen at write time.** A student who upgrades from `✓` to `KART` does not
            retroactively re-badge their old posts: retroactive badges leak the upgrade event
            and correlate a user's posts across threads.

            Subject to the scope-wide k-anonymity substitution: when a rendered scope has
            fewer than 20 card-verified users, `card` is replaced by neutral verification for
            **the whole scope**, never per user — a per-user suppression would itself be the
            signal (`02-identity-spec.md` §5.4, assertion 37). The client cannot tell that a
            substitution happened.
        is_op: { type: boolean, description: "The `MÜƏLLİF` marker. The thread author always holds ordinal 1." }
        profile:
          oneOf:
            - $ref: "#/components/schemas/PublicProfile"
            - type: "null"
          description: |
            Present **only** when `display_mode` is `handle` or `staff`. When it is present,
            every alias field above is absent, and vice versa. No response ever carries both
            (`02-identity-spec.md` rule S-1, assertion 21).
      description: |
        The rendered identity of forum content. **Not authorship.** `public.post` and
        `public.post_comment` carry no author column: authorship lives in `internal.*`, which
        no read path touches. `additionalProperties: false` is load-bearing — a `handle`,
        `app_user_id` or `avatar_id` appearing here alongside an alias would collapse layers 2
        and 3.

    PostListItem:
      type: object
      required: [id, board_id, kind, title, author, time_bucket, time_label, score, comment_count]
      properties:
        id: { type: string, format: uuid }
        board_id: { type: string, format: uuid }
        board_name: { type: [string, "null"] }
        university_id:
          type: [string, "null"]
          format: uuid
          description: |
            **Board scope context, not an author attribute.** It is denormalised from the
            board. It must not be rendered as "this author is from BDU": on a national board
            the two are unrelated. See `05-api-conventions.md` Open question 5.
        kind: { $ref: "#/components/schemas/PostKind" }
        title: { type: string }
        excerpt: { type: [string, "null"] }
        author: { $ref: "#/components/schemas/AliasAuthor" }
        time_bucket: { $ref: "#/components/schemas/TimeBucket" }
        time_label: { type: string, examples: ["~30 dəq"], description: Localised, server-rendered. No raw timestamp is returned. }
        score: { type: integer, examples: [211] }
        comment_count: { type: integer, examples: [62] }
        save_count: { type: integer, examples: [18] }
        view_count: { type: integer }
        attachment_count: { type: integer }
        has_poll: { type: boolean }
        is_pinned: { type: boolean }
        is_locked: { type: boolean }
        moderation_state: { $ref: "#/components/schemas/ModerationState" }
        my_vote: { type: integer, enum: [-1, 0, 1], description: The caller's own vote. There is no endpoint that reveals anyone else's. }
        is_saved: { type: boolean }

    PostPage:
      type: object
      required: [items, page_info]
      properties:
        pinned:
          type: array
          description: Returned ahead of the ordered page and excluded from the cursor.
          items: { $ref: "#/components/schemas/PostListItem" }
        items:
          type: array
          items: { $ref: "#/components/schemas/PostListItem" }
        page_info: { $ref: "#/components/schemas/PageInfo" }

    Attachment:
      type: object
      required: [id, url]
      properties:
        id: { type: string, format: uuid }
        url:
          type: string
          description: |
            Points at a ≥128-bit random object key in a flat namespace. The URL encodes no
            user id, no handle, no post id, and shares no prefix with another object uploaded
            by the same person. The image was **re-encoded server-side with all metadata
            destroyed** — a re-encode, not a tag strip, because thumbnails embedded in EXIF
            survive naive stripping.
          examples: ["https://cdn.kiksu.az/p/8f3a1c9d2e4b6a70.jpg"]
        mime_type: { type: [string, "null"] }
        width: { type: [integer, "null"] }
        height: { type: [integer, "null"] }
        blurhash: { type: [string, "null"] }
        caption: { type: [string, "null"], examples: ["Tapşırıq ekran şəkli"] }

    PollOption:
      type: object
      required: [id, position, label, vote_count]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer }
        label: { type: string, examples: ["Çərşənbə axşamı"] }
        vote_count: { type: integer }

    Poll:
      type: object
      required: [options, total_votes]
      properties:
        question: { type: [string, "null"] }
        is_multi_choice: { type: boolean }
        max_choices: { type: integer, minimum: 1 }
        closes_at:
          type: [string, "null"]
          format: date-time
          description: |
            A raw timestamp, deliberately — a poll deadline is a property of the poll, not of
            anyone's activity. Design renders `2 GÜN QALIB`.
        total_votes: { type: integer, examples: [428], description: Distinct voters. Refreshed on a ≥60 s cache, with no per-option live delta. }
        results_visible:
          type: boolean
          description: False when `hide_results_until_vote` is set and the caller has not voted.
        options:
          type: array
          items: { $ref: "#/components/schemas/PollOption" }
        my_option_ids:
          type: array
          items: { type: string, format: uuid }
          description: |
            The caller's own selection. **There is no endpoint that reveals who voted**, at
            any privilege level below the legal-request service, and none may be added
            (`02-identity-spec.md` T19).

    PollInput:
      type: object
      required: [options]
      properties:
        question: { type: string, maxLength: 300 }
        is_multi_choice: { type: boolean, default: false }
        max_choices: { type: integer, minimum: 1, default: 1 }
        closes_at: { type: string, format: date-time }
        hide_results_until_vote: { type: boolean, default: false }
        options:
          type: array
          minItems: 2
          maxItems: 8
          items: { type: string, minLength: 1, maxLength: 120 }

    PostDetail:
      allOf:
        - $ref: "#/components/schemas/PostListItem"
        - type: object
          properties:
            body: { type: [string, "null"] }
            lang: { $ref: "#/components/schemas/LocaleCode" }
            edited: { type: boolean, description: Boolean only. A raw `edited_at` would reintroduce a precise activity timestamp. }
            is_mine: { type: boolean, description: Resolved server-side from `internal.post_author`, scoped to the token. }
            attachments:
              type: array
              items: { $ref: "#/components/schemas/Attachment" }
            poll:
              oneOf:
                - $ref: "#/components/schemas/Poll"
                - type: "null"

    Comment:
      type: object
      required: [id, post_id, depth, author, time_bucket, time_label, score, moderation_state]
      properties:
        id: { type: string, format: uuid }
        post_id: { type: string, format: uuid }
        parent_id: { type: [string, "null"], format: uuid }
        depth: { type: integer, minimum: 0, maximum: 4 }
        path:
          type: array
          items: { type: integer }
          description: Materialised ancestor chain of per-thread sequence numbers. Threaded ordering from a plain btree, no recursive CTE.
        author: { $ref: "#/components/schemas/AliasAuthor" }
        body:
          type: [string, "null"]
          description: Null when `moderation_state` is `removed`.
        deleted_label:
          type: [string, "null"]
          examples: ["silinib"]
          description: |
            Deleted comments are returned **in place**, keeping their ordinal. Removing them
            would turn `1, 2, 4, 5` into evidence that participant 3 said something removable
            (`02-identity-spec.md` T16, assertion 46). Ordinals are never renumbered.
        time_bucket: { $ref: "#/components/schemas/TimeBucket" }
        time_label: { type: string, examples: ["~30 dəq"] }
        edited: { type: boolean }
        score: { type: integer }
        reply_count: { type: integer }
        moderation_state: { $ref: "#/components/schemas/ModerationState" }
        my_vote: { type: integer, enum: [-1, 0, 1] }
        is_mine: { type: boolean }

    CommentPage:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Comment" }
        page_info: { $ref: "#/components/schemas/PageInfo" }

    AliasPreview:
      type: object
      required: [post_id, alias_number, alias_label, composer_cta, state, is_existing]
      additionalProperties: false
      properties:
        post_id: { type: string, format: uuid }
        alias_number: { type: integer, minimum: 1, examples: [5] }
        alias_label: { type: string, examples: ["ANONİM 5"] }
        composer_cta:
          type: string
          examples: ["ANONİM 5 KİMİ YAZ"]
          description: Already localised — this is grammar, not concatenation, and ru/en do not build it the same way.
        state:
          type: string
          enum: [reserved, active]
          description: "`reserved` — an ordinal is held with a TTL. `active` — the caller has already commented in this thread."
        is_existing:
          type: boolean
          description: True when the caller already holds an ordinal here. Nothing is consumed and nothing is held.
        expires_at:
          type: [string, "null"]
          format: date-time
          description: |
            When the hold lapses. Null when `is_existing` is true. **Authoritative** — the
            client re-issues the call before this passes rather than assuming a fixed TTL,
            because the TTL is server configuration.
      description: |
        The reservation behind `ANONİM 5 KİMİ YAZ`. Takes no user parameter: the caller is
        bound from the token inside a privileged function, so there is no form of this call
        that answers "what ordinal does someone else have"
        (`02-identity-spec.md` §3.3).

    VoteResult:
      type: object
      required: [score, my_vote]
      properties:
        score: { type: integer }
        my_vote: { type: integer, enum: [-1, 0, 1] }

    # ---------- reviews ----------

    ReviewTag:
      type: object
      required: [key, label, polarity]
      properties:
        key: { type: string, examples: ["slides_clear"] }
        label: { type: string, examples: ["Slaydlar aydın"] }
        polarity: { type: string, enum: [positive, neutral, negative], description: Drives colour — positive Şirvan turkuazı, negative Nar. }
        applies_to: { type: string, enum: [instructor, course, both] }
        count: { type: [integer, "null"], description: Present only inside a summary's `top_tags`. }

    ReviewSummary:
      type: object
      required: [review_count]
      properties:
        review_count: { type: integer, examples: [61] }
        course_count: { type: [integer, "null"], examples: [3], description: "Design: `3 FƏNN`. Instructor summaries only." }
        rating_avg: { type: [number, "null"], examples: [4.2] }
        histogram:
          type: [object, "null"]
          description: 1–5 star counts, from the summary table's `star_1..star_5`.
          additionalProperties: { type: integer }
        criteria:
          type: object
          description: The four fixed axes the design renders as four labelled bars. Fixed columns, not EAV.
          properties:
            quality:
              type: object
              properties:
                label: { type: string, examples: ["Dərs keyfiyyəti"] }
                avg: { type: [number, "null"] }
            fairness:
              type: object
              properties:
                label: { type: string, examples: ["Ədalətli qiymət"] }
                avg: { type: [number, "null"] }
            workload:
              type: object
              properties:
                label: { type: string, examples: ["İş yükü"] }
                avg: { type: [number, "null"] }
            attendance_strictness:
              type: object
              properties:
                label: { type: string, examples: ["Davamiyyət tələbi"] }
                avg: { type: [number, "null"] }
        top_tags:
          type: array
          items: { $ref: "#/components/schemas/ReviewTag" }

    InstructorProfile:
      type: object
      required: [instructor, summary]
      properties:
        instructor: { $ref: "#/components/schemas/Instructor" }
        summary: { $ref: "#/components/schemas/ReviewSummary" }
        courses:
          type: array
          description: Courses this instructor has been reviewed for, for the `FƏNN` filter.
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              code: { type: string }
              title: { type: string }
              review_count: { type: integer }
              rating_avg: { type: [number, "null"] }

    ReviewAccess:
      type: object
      required: [state, required_contributions, written_contributions]
      properties:
        state:
          type: string
          enum: [granted, walled, blocked]
          description: |
            Closed enum. `blocked` is a `review_ban` sanction and **contributing does not
            lift it**.
        term:
          type: object
          properties:
            id: { type: string, format: uuid }
            label: { type: string, examples: ["2025/26 Payız"] }
        required_contributions: { type: integer, examples: [1] }
        written_contributions: { type: integer, examples: [0] }
        unlocked_until: { type: [string, "null"], format: date-time }
        message: { type: [string, "null"], examples: ["Rəyləri oxumaq üçün bu semestr bir rəy yaz."] }
        reviewable_sections:
          type: array
          description: |
            Derived from the caller's **own** enrollments, so it is own-data and not a cohort.
            No count of other people appears anywhere in this object.
          items:
            type: object
            properties:
              section_id: { type: string, format: uuid }
              course_id: { type: string, format: uuid }
              course_code: { type: string, examples: ["CS 214"] }
              course_title: { type: string, examples: ["Verilənlər bazası sistemləri"] }
              instructor_id: { type: string, format: uuid }
              instructor_name: { type: string, examples: ["dos. Nigar Əliyeva"] }
              term_label: { type: string, examples: ["2025/26 Payız"] }
              already_written: { type: boolean }
      description: |
        The contribution wall as **explicit, queryable state** rather than a surprise 403.
        The wall cannot live in RLS — deciding whether a student has contributed this semester
        requires `internal.review_author`, which policies may not touch — so it is a
        server-layer rule, and a server-layer rule surfaced only as an error becomes a
        surprise.

    Review:
      type: object
      required: [id, course, instructor, overall_rating, quality, fairness, workload, attendance_strictness]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        course:
          type: object
          properties:
            id: { type: string, format: uuid }
            code: { type: string, examples: ["CS 214"] }
            title: { type: string, examples: ["Verilənlər bazası sistemləri"] }
        instructor:
          type: object
          properties:
            id: { type: string, format: uuid }
            full_name: { type: string, examples: ["Nigar Əliyeva"] }
            title_prefix: { type: [string, "null"], examples: ["dos."] }
        term:
          type: [object, "null"]
          description: |
            Design renders `2024/25 YAZ · CS 214`. **May be absent** on an individual review
            when the `(course, instructor, semester)` cohort is too small: on an 8-person
            section with 3 reviews the reviewer is one of 8 and the text is often decisive
            (`02-identity-spec.md` T17). The threshold `k_review` is unresolved — see
            `05-api-conventions.md` Open question 6.
          properties:
            id: { type: string, format: uuid }
            label: { type: string, examples: ["2024/25 Yaz"] }
        overall_rating: { type: integer, minimum: 1, maximum: 5 }
        quality: { type: integer, minimum: 1, maximum: 5, description: "Dərs keyfiyyəti" }
        fairness: { type: integer, minimum: 1, maximum: 5, description: "Ədalətli qiymət" }
        workload: { type: integer, minimum: 1, maximum: 5, description: "İş yükü" }
        attendance_strictness: { type: integer, minimum: 1, maximum: 5, description: "Davamiyyət tələbi" }
        tags:
          type: array
          items: { $ref: "#/components/schemas/ReviewTag" }
        body: { type: [string, "null"] }
        lang: { $ref: "#/components/schemas/LocaleCode" }
        is_enrollment_verified:
          type: boolean
          description: |
            The `DOĞRULANMIŞ` half of `ANONİM · DOĞRULANMIŞ`. **Gated**: only ever `true`
            when the section cohort at write time met the university's k-anonymity floor. On
            a small section an enrolled verified reviewer *is* identifiable, so the badge is
            suppressed and `false` is returned with no indication that suppression occurred
            and no count.
        helpful_count: { type: integer }
        my_helpful: { type: boolean, description: The caller's own row. }
        time_bucket: { $ref: "#/components/schemas/TimeBucket" }
        time_label: { type: string, examples: ["3 gün"] }
        moderation_state: { $ref: "#/components/schemas/ModerationState" }
      description: |
        **There is no author field, at any tier — not `null`, not `"anonymous"`, absent.**
        The design renders `ANONİM · DOĞRULANMIŞ` and nothing else. Reviews are the one
        surface that renders neither an alias nor a handle, which is why
        `additionalProperties: false` matters here as much as it does on `PublicProfile`.

    ReviewPage:
      type: object
      required: [access, items, page_info]
      properties:
        access:
          allOf:
            - $ref: "#/components/schemas/ReviewAccess"
          description: |
            Always present. When `state` is `walled`, `items` is empty and the response is
            still `200` — the client renders the contribution prompt from a response it
            already has, with no error path and no extra round trip.
        items:
          type: array
          items: { $ref: "#/components/schemas/Review" }
        page_info: { $ref: "#/components/schemas/PageInfo" }

    ReviewInput:
      type: object
      required: [course_id, instructor_id, term_id, overall_rating, quality, fairness, workload, attendance_strictness]
      properties:
        course_id: { type: string, format: uuid }
        instructor_id: { type: string, format: uuid }
        term_id: { type: string, format: uuid }
        overall_rating: { type: integer, minimum: 1, maximum: 5 }
        quality: { type: integer, minimum: 1, maximum: 5 }
        fairness: { type: integer, minimum: 1, maximum: 5 }
        workload: { type: integer, minimum: 1, maximum: 5 }
        attendance_strictness: { type: integer, minimum: 1, maximum: 5 }
        tag_keys:
          type: array
          maxItems: 8
          items: { type: string }
          description: Keys from `ref.review_tag`. At most 8, validated server-side.
        body: { type: string, maxLength: 4000 }
        lang: { $ref: "#/components/schemas/LocaleCode" }
      description: |
        The client sends no author field. Authorship is bound from the token and written to
        `internal.review_author`, which also carries the
        `(app_user_id, course_id, instructor_id, term_id)` uniqueness key — the constraint
        cannot live on `public.review` because `public.review` has no author column.
