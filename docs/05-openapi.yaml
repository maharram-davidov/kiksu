      summary: "Campus feed (\"Kampus gündəmi\")"
      description: |
        Hot posts across every board of the caller's university, from
        `post(university_id, hot_rank desc)`. Same ≥ 60 s cache and quantised cursor as a
        board feed.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Feed page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostPage" }
